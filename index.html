<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Favicon -->
    <link rel="icon" href="0XH.jpg" type="image/jpeg">
    
    <!-- PWA Meta Tags (جعل الموقع يعمل كتطبيق مستقل بدون متصفح) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="0xh">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="0XH.jpg">
    <!-- Manifest مدمج برمجياً لتفعيل التثبيت كبرنامج -->
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%220xh%20WhatsApp%20Direct%22%2C%22short_name%22%3A%220xh%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230f172a%22%2C%22theme_color%22%3A%22%2325D366%22%2C%22icons%22%3A%5B%7B%22src%22%3A%220XH.jpg%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fjpeg%22%7D%5D%7D">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Cairo', sans-serif;
            transition: background-color 0.5s ease, color 0.5s ease;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .dark-mode {
            background-color: #0f172a;
            color: #f8fafc;
        }

        .light-mode {
            background-color: #f0f9ff;
            color: #0f172a;
        }
        
        .light-mode .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
            color: #1e293b;
        }

        /* Important overrides for input text in light mode to be readable */
        .light-mode input, 
        .light-mode select, 
        .light-mode textarea {
            color: #111827 !important; 
            background-color: rgba(255,255,255,0.7) !important;
            border-color: rgba(0,0,0,0.1) !important;
        }
        
        .light-mode input::placeholder, 
        .light-mode textarea::placeholder {
            color: #6b7280 !important;
        }
        
        .light-mode .text-white {
            color: #1e293b !important;
        }
        
        /* Keeping buttons colored correctly in light mode */
        .light-mode .bg-\[\#25D366\] { color: white !important; }
        .light-mode .bg-blue-500 { color: white !important; }
        .light-mode .bg-red-500 { color: white !important; }
        .light-mode #langToggle { color: white !important; background-color: #1e293b; }

        .logo-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto;
            border-radius: 50%;
            background: linear-gradient(135deg, #25D366, #128C7E);
            padding: 5px;
            box-shadow: 0 0 25px rgba(37, 211, 102, 0.6);
            animation: pulse-glow 3s infinite alternate;
            z-index: 10;
        }

        .logo-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .logo-container:hover .logo-img {
            transform: rotate(360deg) scale(1.05);
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 20px rgba(37, 211, 102, 0.4); }
            100% { box-shadow: 0 0 40px rgba(37, 211, 102, 0.8), 0 0 15px rgba(255,255,255,0.2) inset; }
        }

        #particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden; /* Prevent scrolling issue from particles */
        }
        
        .particle { 
            position: absolute; /* Controlled by JS via bottom offset */
            border-radius: 50%; 
            animation: float-up linear infinite; 
        }
        
        .dark-mode .particle { background-color: rgba(37, 211, 102, 0.3); }
        .light-mode .particle { background-color: rgba(14, 165, 233, 0.2); }

        @keyframes float-up {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-120vh) translateX(50px); opacity: 0; }
        }

        .celestial-body {
            position: absolute; display: flex; justify-content: center; align-items: center;
            width: 100%; height: 100%; top: 0; left: 0;
        }

        .moon {
            width: 22px; height: 22px;
            background-color: transparent;
            border-radius: 50%;
            box-shadow: 6px 4px 0 0 #f8fafc;
            margin-right: 6px; margin-bottom: 4px;
        }
        .light-mode .moon { box-shadow: 6px 4px 0 0 #0f172a; }

        .sun {
            width: 22px; height: 22px;
            background: #FDB813;
            border-radius: 50%;
            box-shadow: 0 0 10px #FDB813, 0 0 20px #FDB813;
        }

        @keyframes slideDownOut {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(40px); opacity: 0; }
        }
        @keyframes slideDownIn {
            0% { transform: translateY(-40px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .animate-out { animation: slideDownOut 0.4s forwards; }
        .animate-in { animation: slideDownIn 0.4s forwards; }
        .hide { display: none !important; }

        #toast-container {
            position: fixed; /* This guarantees it stays on screen regardless of scroll */
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999; /* Always on top */
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
            width: 90%;
            max-width: 400px;
        }
        
        .toast {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border-bottom: 3px solid #ef4444; 
            opacity: 0;
            transform: translateY(-20px);
            animation: toastEnter 0.3s forwards;
            direction: rtl; 
        }
        
        .toast.success { border-bottom-color: #25D366; }
        
        @keyframes toastEnter {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes toastExit {
            to { opacity: 0; transform: translateY(-20px); }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: #25D366; border-radius: 10px; }
        
        .modal { background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); }
        .custom-checkbox { accent-color: #25D366; width: 1.2rem; height: 1.2rem; }

        .shake-anim { animation: shake 0.3s ease-in-out; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>
</head>
<body class="dark-mode transition-colors duration-300" id="body">
    
    <!-- Background Particles -->

    <!-- Top Controls (Scrolls with page) -->

            </div>

            <h1 class="text-4xl font-black mb-2 text-[#25D366]">0xh <span data-i18n="whatsapp">واتساب</span></h1>

                    <input type="text" id="nameHint" maxlength="12" class="w-full bg-white/10 border border-white/20 text-white rounded-xl px-4 py-3 text-center focus:outline-none focus:ring-2 focus:ring-[#25D366] transition placeholder-gray-400" placeholder="اسم الشخص أو تلميح (اختياري)" autocomplete="off">

                    <select id="selectedLocation" class="w-full bg-white/10 border border-white/20 text-white rounded-xl px-4 py-3 text-center focus:outline-none focus:ring-2 focus:ring-[#25D366] transition appearance-none font-bold" style="text-align-last: center;">

    <!-- LOCATIONS VIEW (Separate Page) -->

    <!-- HISTORY VIEW (Separate Page) -->

            <i class="fas fa-arrow-right rtl:rotate-0 ltr:rotate-180"></i>
            <span data-i18n="returnTop">العودة للرئيسية</span>
        </button>

        <div class="glass-panel p-6 rounded-3xl w-full max-w-md">
            <div class="flex justify-between items-center mb-6 border-b border-white/10 pb-4">
                <h2 class="text-2xl font-bold text-[#25D366]" data-i18n="historyTitle">سجل الأرقام</h2>
                
                <select id="historyFilter" onchange="renderHistoryDetailed()" class="bg-white/10 border border-white/20 text-white text-sm rounded-lg px-2 py-1 focus:outline-none focus:ring-1 focus:ring-[#25D366]">

        // --- Core Application Setup ---
        function init() {
            createParticles();

        // --- STREAMING_CHUNK:Rendering Particle Effects... ---
        function createParticles() {
            const container = document.getElementById('particles');
            if (!container) return;
            container.innerHTML = '';
            for(let i=0; i<15; i++) {
                let div = document.createElement('div');
                div.className = 'particle';
                let size = Math.random() * 8 + 4;
                div.style.width = size + 'px';
                div.style.height = size + 'px';
                div.style.left = Math.random() * 100 + 'vw';
                // Fixed: Start particles below screen to prevent clumping
                div.style.bottom = '-20px'; 
                div.style.animationDuration = (Math.random() * 10 + 5) + 's';
                div.style.animationDelay = (Math.random() * 5) + 's';
                container.appendChild(div);
            }
        }

        // --- STREAMING_CHUNK:Configuring Smart Toasts and Inputs... ---
        function showToast(message, isError = true) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${isError ? '' : 'success'}`;
            
            const icon = isError ? '<i class="fas fa-exclamation-circle text-red-400 ml-2 rtl:mr-2"></i>' 
                                 : '<i class="fas fa-check-circle text-green-400 ml-2 rtl:mr-2"></i>';
            toast.innerHTML = `<div class="flex items-center">${icon} ${message}</div>`;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'toastExit 0.3s forwards';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function setupInputIntelligence() {
            const phoneInput = document.getElementById('phoneInput');
            const nameHint = document.getElementById('nameHint');
            
            // 1. Instant space removal while typing
            phoneInput.addEventListener('input', function() {
                this.value = this.value.replace(/\s+/g, '');
            });

            // 2. Auto-Paste from Clipboard
            phoneInput.addEventListener('focus', async function() {
                if(this.value === '') {
                    try {
                        const text = await navigator.clipboard.readText();
                        if(text) {
                            const cleaned = text.replace(/[\s-]/g, '');
                            if (/^\+?[0-9]{7,15}$/.test(cleaned)) {
                                this.value = cleaned;
                                showToast(currentLang === 'ar' ? 'تم لصق الرقم من الحافظة تلقائياً' : 'Number pasted from clipboard', false);
                            }
                        }
                    } catch (err) { }
                }
            });

            // 3. Name Length Guard
            nameHint.addEventListener('input', function() {
                if(this.value.length >= 12) {
                    this.value = this.value.substring(0, 12);
                    this.classList.add('shake-anim', 'border-red-500');
                    showToast(translations[currentLang].errorNameLength, true);
                    setTimeout(() => this.classList.remove('shake-anim', 'border-red-500'), 400);
                }
            });
        }

        // --- STREAMING_CHUNK:Handling UI Routing... ---
        function handleRouting() {
            const main = document.getElementById('mainView');
            const help = document.getElementById('helpView');
            const hist = document.getElementById('historyView');
            const locs = document.getElementById('locationsView');
            
            main.classList.add('hidden');
            help.classList.add('hidden');
            hist.classList.add('hidden');
            locs.classList.add('hidden');

            if(window.location.hash === '#help') {
                help.classList.remove('hidden');
            } else if(window.location.hash === '#history') {
                hist.classList.remove('hidden');
                renderHistoryDetailed(); 
            } else if(window.location.hash === '#locations') {
                locs.classList.remove('hidden');
                renderLocationsManager(); 
            } else {
                main.classList.remove('hidden');
            }
            window.scrollTo(0,0);
        }
        
        function openHelp() { window.location.hash = 'help'; }
        function openHistoryView() { window.location.hash = 'history'; }
        function openLocationsView() { window.location.hash = 'locations'; }
        function closeViews() { window.location.hash = ''; selectionMode = false; }

        // --- STREAMING_CHUNK:Handling Theme and Translation... ---

            isDarkMode = !isDarkMode;
            const body = document.getElementById('body');
            const sun = document.getElementById('sunIcon');
            const moon = document.getElementById('moonIcon');

            if (isDarkMode) {
                body.classList.replace('light-mode', 'dark-mode');
                sun.classList.remove('animate-in');
                sun.classList.add('animate-out');
                setTimeout(() => {
                    sun.classList.add('hide');
                    moon.classList.remove('hide', 'animate-out');
                    moon.classList.add('animate-in');
                }, 400);
            } else {
                body.classList.replace('dark-mode', 'light-mode');
                moon.classList.remove('animate-in');
                moon.classList.add('animate-out');
                setTimeout(() => {
                    moon.classList.add('hide');
                    sun.classList.remove('hide', 'animate-out');
                    sun.classList.add('animate-in');
                }, 400);
            }
        });

        document.getElementById('langToggle').addEventListener('click', () => {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.getElementById('langToggle').innerText = currentLang === 'ar' ? 'EN' : 'عربي';
            applyLanguage();
        });

        function applyLanguage() {
            document.getElementById('html-root').setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
            document.getElementById('html-root').setAttribute('lang', currentLang);
            
            document.getElementById('phoneInput').placeholder = translations[currentLang].phonePlaceholder;
            document.getElementById('nameHint').placeholder = translations[currentLang].namePlaceholder;
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');

                    if(el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                        el.placeholder = translations[currentLang][key];
                    } else {
                        el.innerText = translations[currentLang][key];
                    }
                }
            });

            if(currentLang === 'en') {
                document.getElementById('helpContent').innerHTML = `
                    <div><h3 class="font-bold text-lg text-blue-400 mb-1"><i class="fas fa-bolt"></i> Smart Routing & Auto-Paste:</h3><p>App instantly removes spaces. Local formats (e.g. 079) convert to +962 automatically. Recognizes copied numbers on click.</p></div>
                    <div><h3 class="font-bold text-lg text-green-400 mb-1"><i class="fas fa-map-marker-alt"></i> Attach Location:</h3><p>Manage your saved maps via "Manage Locations" view. Select one before sending, or use GPS to fetch your live location.</p></div>
                    <div><h3 class="font-bold text-lg text-purple-400 mb-1"><i class="fas fa-layer-group"></i> Window Management:</h3><p>History and Locations are now separated into clean, dedicated windows for better organization.</p></div>
                    <div><h3 class="font-bold text-lg text-yellow-400 mb-1"><i class="fas fa-shield-alt"></i> App Install & Privacy:</h3><p>You can add this site to your home screen as a standalone app! All data is saved securely inside your device.</p></div>
                `;
            } else {
                document.getElementById('helpContent').innerHTML = `
                    <div><h3 class="font-bold text-lg text-blue-400 mb-1"><i class="fas fa-bolt"></i> اللصق الذكي وحذف المسافات:</h3><p>بمجرد نسخ رقم ولصقه سيتم حذف أي مسافات تلقائياً. الأرقام المحلية (079) تتحول تلقائياً لمفتاح الأردن 962.</p></div>
                    <div><h3 class="font-bold text-lg text-green-400 mb-1"><i class="fas fa-map-marker-alt"></i> إرفاق الموقع (و GPS):</h3><p>قم بإدارة مواقعك عبر نافذة "إدارة المواقع"، أو اختر إرسال موقعك الحالي ليتم طلبه من النظام وإرفاقه فوراً.</p></div>
                    <div><h3 class="font-bold text-lg text-purple-400 mb-1"><i class="fas fa-layer-group"></i> النوافذ المستقلة:</h3><p>تم فصل السجل وإدارة المواقع في نوافذ منفصلة لضمان أقصى درجات الترتيب والاحترافية.</p></div>
                    <div><h3 class="font-bold text-lg text-yellow-400 mb-1"><i class="fas fa-shield-alt"></i> التثبيت والخصوصية:</h3><p>تستطيع تثبيت الموقع على شاشة هاتفك كتطبيق كامل. البيانات تُحفظ في جهازك فقط (Local Storage).</p></div>

        // --- STREAMING_CHUNK:Managing Geolocation Features... ---
        function openLocManageModal(id = null) {
            const title = document.getElementById('locModalTitle');
            if (id) {
                const loc = savedLocations.find(l => l.id === id);
                document.getElementById('locModalId').value = loc.id;
                document.getElementById('modalLocName').value = loc.name;
                document.getElementById('modalLocLink').value = loc.link;
                document.getElementById('modalLocMessage').value = loc.message || '';
                title.innerText = currentLang === 'ar' ? 'تعديل الموقع' : 'Edit Location';
            } else {
                document.getElementById('locModalId').value = '';
                document.getElementById('modalLocName').value = '';
                document.getElementById('modalLocLink').value = '';
                document.getElementById('modalLocMessage').value = '';
                title.innerText = translations[currentLang].addLocationBtn;
            }
            
            const modal = document.getElementById('locManageModal');
            const content = document.getElementById('locManageModalContent');
            modal.classList.remove('hidden');
            setTimeout(() => content.classList.remove('scale-95'), 10);
        }

        function closeLocManageModal() {
            const modal = document.getElementById('locManageModal');
            const content = document.getElementById('locManageModalContent');
            content.classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function saveLocationModal() {
            const id = document.getElementById('locModalId').value;
            const name = document.getElementById('modalLocName').value.trim();
            const link = document.getElementById('modalLocLink').value.trim();
            const message = document.getElementById('modalLocMessage').value.trim();

            if(!name || !link) {
                showToast(currentLang === 'ar' ? 'الاسم والرابط مطلوبان' : 'Name and Link are required', true);
                return;
            }
            if(name.length > 12) {
                showToast(translations[currentLang].errorNameLength, true);
                return;
            }

            if (id) {
                const index = savedLocations.findIndex(l => l.id === id);
                if (index > -1) savedLocations[index] = { id, name, link, message };
            } else {
                savedLocations.push({ id: Date.now().toString(), name, link, message });
            }

            localStorage.setItem('0xh_locations', JSON.stringify(savedLocations));
            renderLocations();
            renderLocationsManager();
            closeLocManageModal();
            showToast(currentLang === 'ar' ? 'تم الحفظ بنجاح' : 'Saved successfully', false);
        }

        function renderLocations() {
            const select = document.getElementById('selectedLocation');
            const currentGps = translations[currentLang].currentGpsOption;
            select.innerHTML = `
                <option value="" class="text-gray-800">${translations[currentLang].noLocationSelected}</option>
                <option value="CURRENT_GPS" class="text-blue-600 font-black">${currentGps}</option>
            `;
            
            savedLocations.forEach(loc => {
                const opt = document.createElement('option');
                opt.value = loc.id;
                opt.className = "text-gray-900 font-bold";
                opt.textContent = `📍 ${loc.name}`;
                select.appendChild(opt);
            });
        }

        function renderLocationsManager() {
            const listContainer = document.getElementById('locationsListContainer');
            listContainer.innerHTML = '';
            
            if(savedLocations.length === 0) {
                listContainer.innerHTML = `<div class="text-center text-sm opacity-50 py-2 text-white">${currentLang === 'ar' ? 'لا توجد مواقع محفوظة' : 'No saved locations'}</div>`;
                return;
            }

            savedLocations.forEach(loc => {
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-white/5 p-3 rounded-xl border border-white/10 hover:bg-white/10 transition group";
                div.innerHTML = `
                    <div class="overflow-hidden flex-1 pl-2 rtl:pr-2">
                        <h4 class="font-bold text-sm text-[#25D366] truncate">${loc.name}</h4>
                        <p class="text-xs text-white opacity-70 truncate" dir="ltr">${loc.link}</p>
                    </div>
                    <div class="flex gap-2 px-2 transition shrink-0">
                        <button onclick="openLocManageModal('${loc.id}')" class="bg-blue-500/20 text-blue-300 hover:bg-blue-500 hover:text-white w-8 h-8 rounded-lg transition flex items-center justify-center">
                            <i class="fas fa-pen text-xs"></i>
                        </button>
                        <button onclick="deleteLocation('${loc.id}')" class="bg-red-500/20 text-red-300 hover:bg-red-500 hover:text-white w-8 h-8 rounded-lg transition flex items-center justify-center">
                            <i class="fas fa-trash text-xs"></i>
                        </button>
                    </div>
                `;
                listContainer.appendChild(div);
            });
        }

        function deleteLocation(id) {
            savedLocations = savedLocations.filter(loc => loc.id !== id);
            localStorage.setItem('0xh_locations', JSON.stringify(savedLocations));
            renderLocations();
            renderLocationsManager();
        }

        // --- STREAMING_CHUNK:Executing Direct WhatsApp Transfer... ---
        async function handleSend() {
            let phone = document.getElementById('phoneInput').value.replace(/\s+/g, '').replace(/[^0-9+]/g, '');
            let name = document.getElementById('nameHint').value.trim();
            let selectedLocId = document.getElementById('selectedLocation').value;
            
            if (!phone) {
                showToast(translations[currentLang].errorEmptyPhone, true);
                return;
            }
            if (phone.length < 7) { showToast(translations[currentLang].errorShortPhone, true); return; }
            if (phone.length > 15) { showToast(translations[currentLang].errorLongPhone, true); return; }
            if (name.length > 12) { showToast(translations[currentLang].errorNameLength, true); return; }

            if (phone.startsWith('07') && phone.length === 10) phone = '962' + phone.substring(1);
            else if (phone.startsWith('00')) phone = phone.substring(2);
            else if (phone.startsWith('+')) phone = phone.substring(1);

            const btn = document.getElementById('sendBtn');
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');

            let textParam = "";
            let locationNameForHistory = "";
            let messageContentForHistory = "";

            if (selectedLocId === 'CURRENT_GPS') {
                btn.classList.add('opacity-80', 'animate-pulse');
                btnIcon.className = "fas fa-spinner fa-spin text-2xl";
                btnText.innerText = translations[currentLang].loadingGps;

                try {
                    const position = await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(resolve, reject, {timeout: 10000});
                    });
                    const mapLink = `https://maps.google.com/?q=${position.coords.latitude},${position.coords.longitude}`;
                    const msg = currentLang === 'ar' ? `مرحباً، هذا هو موقعي الحالي:\n${mapLink}` : `Hello, this is my current location:\n${mapLink}`;
                    textParam = `?text=${encodeURIComponent(msg)}`;
                    locationNameForHistory = currentLang === 'ar' ? 'موقعي الحالي (GPS)' : 'Current GPS';
                    messageContentForHistory = msg;
                } catch (error) {
                    showToast(translations[currentLang].toastGpsError, true);
                    btn.classList.remove('opacity-80', 'animate-pulse');
                    btnIcon.className = "fab fa-whatsapp text-2xl";
                    btnText.innerText = translations[currentLang].transferBtn;
                    return;
                }
            } else if (selectedLocId) {
                const loc = savedLocations.find(l => l.id === selectedLocId);
                if (loc) {
                    const messageContent = loc.message ? `${loc.message}\n${loc.link}` : loc.link;
                    textParam = `?text=${encodeURIComponent(messageContent)}`;
                    locationNameForHistory = loc.name;
                    messageContentForHistory = messageContent;
                }
            }

            const existingIndex = history.findIndex(item => item.phone === phone);
            if (existingIndex > -1) {
                history[existingIndex].name = name || history[existingIndex].name;
                history[existingIndex].locationSent = locationNameForHistory || history[existingIndex].locationSent;
                history[existingIndex].messageSent = messageContentForHistory || history[existingIndex].messageSent;
                history[existingIndex].date = new Date().toISOString();
            } else {
                history.unshift({
                    id: Date.now().toString(),
                    phone: phone,
                    name: name,
                    locationSent: locationNameForHistory,
                    messageSent: messageContentForHistory,
                    notes: "", 
                    date: new Date().toISOString()
                });
            }
            if(history.length > 100) history.pop(); 
            localStorage.setItem('0xh_history', JSON.stringify(history));

            btn.classList.remove('animate-pulse');
            btn.classList.add('scale-95', 'opacity-80');
            btnIcon.className = "fab fa-whatsapp text-2xl";
            btnText.innerText = translations[currentLang].readyBtn;
            
            setTimeout(() => {
                btn.classList.remove('scale-95', 'opacity-80');
                btnText.innerText = translations[currentLang].transferBtn;
                window.location.href = `https://wa.me/${phone}${textParam}`;
                
                // Auto-clear logic
                document.getElementById('phoneInput').value = '';
                document.getElementById('nameHint').value = '';
                document.getElementById('selectedLocation').value = '';
            }, 500);
        }

        // --- STREAMING_CHUNK:Rendering Detailed History UI... ---
        function renderHistoryDetailed() {
            const list = document.getElementById('detailedHistoryList');
            const filterValue = document.getElementById('historyFilter').value;
            list.innerHTML = '';
            
            let filteredHistory = history;
            const now = new Date();
            
            if(filterValue === 'TODAY') {
                filteredHistory = history.filter(h => new Date(h.date).toDateString() === now.toDateString());
            } else if (filterValue === 'YESTERDAY') {
                const yesterday = new Date(now);
                yesterday.setDate(yesterday.getDate() - 1);
                filteredHistory = history.filter(h => new Date(h.date).toDateString() === yesterday.toDateString());
            }

            if (filteredHistory.length === 0) {
                list.innerHTML = `<div class="text-center text-white opacity-50 py-10 border-2 border-dashed border-white/10 rounded-xl">${currentLang === 'ar' ? 'لا يوجد سجل يطابق البحث' : 'No records found'}</div>`;
                return;
            }

            filteredHistory.forEach(item => {
                const card = document.createElement('div');
                card.className = 'glass-panel p-4 rounded-2xl relative text-right bg-white/5 border border-white/10';
                if(currentLang === 'en') card.classList.replace('text-right', 'text-left');
                
                const itemDate = new Date(item.date);
                let dateStr = itemDate.toLocaleDateString();
                const timeStr = itemDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                if (itemDate.toDateString() === now.toDateString()) {
                    dateStr = translations[currentLang].lblToday;
                } else {
                    const yest = new Date(now); yest.setDate(yest.getDate()-1);
                    if (itemDate.toDateString() === yest.toDateString()) dateStr = translations[currentLang].lblYesterday;
                }

                let checkboxHTML = selectionMode ? 
                    `<input type="checkbox" class="custom-checkbox absolute top-4 ${currentLang === 'ar' ? 'left-4' : 'right-4'} z-10" onchange="toggleSelection('${item.id}', this.checked)" ${selectedIds.has(item.id) ? 'checked' : ''}>` : '';

                let locationTag = item.locationSent ? 
                    `<div class="inline-block mt-2 text-xs bg-blue-500/20 text-blue-300 px-2 py-1 rounded-md border border-blue-500/30 font-bold">
                        <i class="fas fa-map-marker-alt"></i> ${translations[currentLang].lblSentLocation} ${item.locationSent}
                    </div>` : '';

                let notesSection = item.notes ? 
                    `<div class="mt-3 pt-3 border-t border-white/10">
                        <p class="text-xs text-[#25D366] font-bold mb-1"><i class="fas fa-sticky-note"></i> ${translations[currentLang].notesLabel}:</p>
                        <p class="text-sm text-white opacity-90 whitespace-pre-wrap">${item.notes}</p>
                    </div>` : '';

                card.innerHTML = `
                    ${checkboxHTML}
                    <div class="flex justify-between items-start mb-2">
                        <div class="text-xs text-white opacity-50 font-bold">${translations[currentLang].lblAdded} ${dateStr}، ${timeStr}</div>
                        <div class="flex gap-2 ${selectionMode ? 'hidden' : ''}">
                            <button onclick="openEditHistoryModal('${item.id}')" class="bg-blue-500/20 hover:bg-blue-500 text-blue-300 hover:text-white w-7 h-7 rounded transition flex items-center justify-center">
                                <i class="fas fa-pen text-xs"></i>
                            </button>
                            <button onclick="confirmDelete('${item.id}')" class="bg-red-500/20 hover:bg-red-500 text-red-300 hover:text-white w-7 h-7 rounded transition flex items-center justify-center">
                                <i class="fas fa-trash text-xs"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="font-black text-2xl text-white mb-1" dir="ltr" style="text-align: ${currentLang === 'ar' ? 'right' : 'left'}">+${item.phone}</div>
                    
                    ${item.name ? `<div class="font-bold text-md text-[#25D366]">${item.name}</div>` : ''}
                    ${locationTag}
                    ${notesSection}
                    
                    <div class="mt-4 flex gap-2">
                        <a href="https://wa.me/${item.phone}" class="flex-1 bg-white/10 hover:bg-[#25D366] hover:text-white text-gray-300 text-center py-2 rounded-lg font-bold text-sm transition transition-colors">
                            <i class="fab fa-whatsapp"></i> مراسلة
                        </a>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        // --- STREAMING_CHUNK:Managing Multi-Select and Delete Logic... ---
        function toggleSelectionUI() {
            selectionMode = !selectionMode;
            selectedIds.clear();
            const bar = document.getElementById('multiDeleteBar');
            bar.classList.toggle('hidden', !selectionMode);
            
            renderHistoryDetailed();
            updateSelectedCount();
        }

        function toggleSelection(id, isChecked) {
            isChecked ? selectedIds.add(id) : selectedIds.delete(id);
            updateSelectedCount();
        }

        function updateSelectedCount() {
            document.getElementById('selectedCountText').innerText = currentLang === 'ar' ? `${selectedIds.size} محدد` : `${selectedIds.size} Selected`;
        }

        function openEditHistoryModal(id) {
            const item = history.find(h => h.id === id);
            if (!item) return;
            document.getElementById('editHistId').value = item.id;
            document.getElementById('editHistPhone').value = item.phone;
            document.getElementById('editHistName').value = item.name || '';
            document.getElementById('editHistNotes').value = item.notes || '';
            
            const modal = document.getElementById('editHistoryModal');
            const content = document.getElementById('editHistoryModalContent');
            modal.classList.remove('hidden');
            setTimeout(() => content.classList.remove('scale-95'), 10);
        }

        function closeEditHistoryModal() {
            const modal = document.getElementById('editHistoryModal');
            const content = document.getElementById('editHistoryModalContent');
            content.classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function saveHistoryEdit() {
            const id = document.getElementById('editHistId').value;
            const phone = document.getElementById('editHistPhone').value.trim().replace(/\s+/g, '');
            const name = document.getElementById('editHistName').value.trim();
            const notes = document.getElementById('editHistNotes').value.trim();
            
            if (!phone) { showToast(translations[currentLang].errorEmptyPhone, true); return; }
            if (name.length > 12) { showToast(translations[currentLang].errorNameLength, true); return; }

            const index = history.findIndex(h => h.id === id);
            if (index > -1) {
                history[index].phone = phone;
                history[index].name = name;
                history[index].notes = notes;
                localStorage.setItem('0xh_history', JSON.stringify(history));
                renderHistoryDetailed();
            }
            closeEditHistoryModal();
            showToast(currentLang === 'ar' ? 'تم الحفظ' : 'Saved', false);
        }

        function confirmDelete(id) { itemToDelete = id; showDeleteModal(); }
        function confirmDeleteAll() { if (history.length === 0) return; itemToDelete = 'ALL'; showDeleteModal(); }
        function executeMultiDelete() { if (selectedIds.size === 0) return; itemToDelete = 'MULTI'; showDeleteModal(); }

        function showDeleteModal() {
            const modal = document.getElementById('deleteModal');
            const content = document.getElementById('deleteModalContent');
            modal.classList.remove('hidden');
            setTimeout(() => content.classList.remove('scale-95'), 10);

            document.getElementById('confirmDeleteBtn').onclick = function() {
                if (itemToDelete === 'ALL') {
                    history = [];
                } else if (itemToDelete === 'MULTI') {
                    history = history.filter(h => !selectedIds.has(h.id));
                    toggleSelectionUI(); 
                } else {
                    history = history.filter(h => h.id !== itemToDelete);
                }
                
                localStorage.setItem('0xh_history', JSON.stringify(history));
                renderHistoryDetailed();
                closeDeleteModal();
                showToast(currentLang === 'ar' ? 'تم الحذف' : 'Deleted', false);
            };
        }
        function closeDeleteModal() {
            const modal = document.getElementById('deleteModal');
            const content = document.getElementById('deleteModalContent');
            content.classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
            itemToDelete = null;
        }

        // --- Start App ---
        window.onload = init;
    </script>
</body>
</html>
