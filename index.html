<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0xh WhatsApp</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Config for Custom Colors -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#10b981', // Emerald 500
                        primaryDark: '#047857', // Emerald 700
                        darkBg: '#0f172a', // Slate 900
                        lightBg: '#f8fafc', // Slate 50
                    },
                    fontFamily: {
                        sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Open Sans', 'Helvetica Neue', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* --- General Utilities --- */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .hide { display: none !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 10px; }
        
        /* --- Glassmorphism --- */
        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
        }
        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        /* --- Animations --- */
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        
        .fade-in { animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Celestial Bodies (Sun & Moon) --- */
        .celestial-container {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .celestial-body {
            position: absolute;
            border-radius: 50%;
            transition: all 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            left: 50%;
            transform: translateX(-50%);
        }
        
        /* Sun (Light Mode) */
        .sun-state {
            top: 10%;
            width: 150px; height: 150px;
            background: radial-gradient(circle, #fef08a 0%, #f59e0b 100%);
            box-shadow: 0 0 60px #fef08a, 0 0 100px #eab308, 0 0 150px rgba(245, 158, 11, 0.5);
            opacity: 1;
        }
        .dark .sun-state { top: -30%; opacity: 0; }
        
        /* Moon (Dark Mode) */
        .moon-state {
            top: -30%; opacity: 0;
            width: 120px; height: 120px;
            background: radial-gradient(circle at 30% 30%, #f8fafc 0%, #94a3b8 100%);
            box-shadow: inset -15px -15px 25px rgba(0,0,0,0.4), 0 0 40px rgba(255,255,255,0.3);
        }
        .dark .moon-state { top: 15%; opacity: 1; }
        
        /* --- Shimmer Text Effect --- */
        .animate-shimmer-text {
            background: linear-gradient(to right, #64748b 20%, #0f172a 40%, #0f172a 60%, #64748b 80%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shimmer 3s linear infinite;
        }
        .dark .animate-shimmer-text {
            background: linear-gradient(to right, #94a3b8 20%, #f8fafc 40%, #f8fafc 60%, #94a3b8 80%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shimmer 3s linear infinite;
        }
        @keyframes shimmer {
            to { background-position: 200% center; }
        }

        #bg-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }
    </style>
</head>

<body class="bg-lightBg dark:bg-darkBg text-slate-800 dark:text-slate-200 min-h-screen flex flex-col items-center justify-center relative transition-colors duration-500 pb-24">
    
    <!-- Canvas for Particle Background -->
    <canvas id="bg-canvas"></canvas>

    <!-- Celestial Backgrounds (Sun / Moon) -->
    <div class="celestial-container">
        <div class="celestial-body sun-state"></div>
        <div class="celestial-body moon-state"></div>
    </div>

    <!-- Top Controls: Settings (Fixed & High Z-Index to avoid overlap) -->
    <div class="fixed top-4 right-4 rtl:left-4 rtl:right-auto flex gap-3 z-50 glass-panel p-2 rounded-full shadow-lg">
        <button id="themeToggle" class="p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-700 transition" aria-label="Toggle Theme">
            <!-- Moon Icon -->
            <svg id="moonIcon" class="w-6 h-6 text-slate-700 dark:text-slate-300 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
            <!-- Sun Icon -->
            <svg id="sunIcon" class="w-6 h-6 text-slate-700 dark:text-slate-300 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
        </button>
        <button id="langToggle" class="p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-700 font-bold text-sm transition w-10 h-10 flex items-center justify-center">
            EN
        </button>
    </div>

    <!-- Main Content Container -->
    <main class="w-full max-w-md p-6 relative z-10 flex flex-col items-center">
        <!-- Main Card -->
        <div class="glass-panel rounded-3xl p-8 w-full flex flex-col items-center animate-float" style="animation-duration: 8s;">
            
            <!-- Logo (Loads 0xh.png, falls back to styled text if not found) -->
            <img src="0xh.png" alt="0xh" 
                onerror="this.outerHTML='<div class=\'w-24 h-24 bg-primary/20 rounded-full flex items-center justify-center text-primary font-bold text-3xl shadow-lg border-2 border-primary/30 mb-4\'>0xh</div>'" 
                class="w-24 h-24 rounded-full object-cover shadow-lg border-2 border-primary/30 mb-4 z-10 relative">

            <h1 id="appTitle" class="text-3xl font-extrabold mb-1 bg-clip-text text-transparent bg-gradient-to-r from-primary to-emerald-400">
                0xh واتساب
            </h1>
            <p id="appDesc" class="text-sm text-slate-500 dark:text-slate-400 mb-8 text-center">
                تواصل فوراً بدون حفظ الرقم
            </p>

            <!-- Phone Input Section -->
            <div class="w-full mb-4 relative group">
                <input type="tel" id="phoneInput" 
                    class="w-full bg-white/50 dark:bg-slate-800/50 border-2 border-slate-200 dark:border-slate-700 rounded-2xl py-4 px-6 text-lg focus:outline-none focus:border-primary dark:focus:border-primary transition-all duration-300 rtl:text-right ltr:text-left shadow-inner"
                    placeholder="أدخل الرقم (مثال: 07... أو 962...)" dir="auto">
                <div class="absolute bottom-0 left-0 h-0.5 w-0 bg-primary transition-all duration-500 group-focus-within:w-full rounded-b-2xl"></div>
            </div>

            <!-- Optional Note/Name Section -->
            <div class="w-full mb-6 relative group">
                <input type="text" id="noteInput" 
                    class="w-full bg-white/40 dark:bg-slate-800/40 border-2 border-slate-100 dark:border-slate-700/50 rounded-2xl py-3 px-6 text-sm focus:outline-none focus:border-primary/50 dark:focus:border-primary/50 transition-all duration-300 rtl:text-right ltr:text-left shadow-sm"
                    placeholder="الاسم أو تلميح (اختياري)" dir="auto">
            </div>

            <!-- Action Button -->
            <button id="sendBtn" class="w-full bg-gradient-to-r from-primaryDark to-green-500 hover:from-green-600 hover:to-green-400 text-white font-bold py-4 px-6 rounded-2xl shadow-lg transform hover:-translate-y-1 hover:shadow-xl transition-all duration-300 flex items-center justify-center gap-2 relative overflow-hidden">
                <span id="btnText" class="relative z-10">تحويل ومراسلة</span>
                <svg id="btnIcon" class="w-5 h-5 relative z-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                <!-- Shine effect -->
                <div id="btnEffect" class="absolute top-0 left-0 w-full h-full bg-white opacity-20 transform -translate-x-full transition-transform duration-500"></div>
            </button>
        </div>

        <!-- History Section -->
        <div id="historyContainer" class="mt-8 glass-panel rounded-2xl p-5 w-full hide fade-in relative z-10">
            <h3 id="historyTitle" class="text-sm font-bold text-slate-600 dark:text-slate-300 mb-4 border-b border-slate-200 dark:border-slate-700 pb-2">
                الأرقام السابقة
            </h3>
            <ul id="historyList" class="max-h-52 overflow-y-auto custom-scrollbar flex flex-col gap-2 pr-1 rtl:pr-0 rtl:pl-1">
                <!-- Items injected here -->
            </ul>
            <button id="clearHistoryBtn" class="mt-4 text-xs text-red-500 hover:text-red-600 transition w-full text-center py-2 rounded-lg hover:bg-red-50 dark:hover:bg-red-900/20">
                مسح السجل
            </button>
        </div>
    </main>

    <!-- Watermark Footer (Fixed always at the bottom) -->
    <footer class="fixed bottom-4 left-0 w-full z-50 flex justify-center pointer-events-none">
        <a href="https://link.me/mkm" target="_blank" rel="noopener noreferrer" class="inline-block px-5 py-2.5 glass-panel rounded-full text-xs md:text-sm font-bold transition-all hover:scale-105 transform duration-300 shadow-md pointer-events-auto border-t border-white/20">
            <span id="watermarkText" class="animate-shimmer-text">تم تطوير هذا الموقع بواسطه mkm</span>
        </a>
    </footer>

    <script>
        // --- Application State ---
        let currentLang = 'ar';
        let isDark = true; // Default to dark mode
        let history = [];

        // --- Translations ---
        const translations = {
            ar: {
                title: "0xh واتساب",
                desc: "تواصل فوراً بدون حفظ الرقم",
                placeholder: "أدخل الرقم (مثال: 07... أو 962...)",
                notePlaceholder: "الاسم أو تلميح (اختياري)",
                btn: "تحويل ومراسلة",
                btnReady: "جاهز! جاري النقل...",
                historyTitle: "الأرقام السابقة",
                clearHistory: "مسح السجل"
            },
            en: {
                title: "0xh WhatsApp",
                desc: "Chat instantly without saving",
                placeholder: "Enter number (e.g. 07... or 962...)",
                notePlaceholder: "Name or Note (Optional)",
                btn: "Open WhatsApp",
                btnReady: "Ready! Redirecting...",
                historyTitle: "Previous Numbers",
                clearHistory: "Clear History"
            }
        };

        // --- DOM Elements ---
        const phoneInput = document.getElementById('phoneInput');
        const noteInput = document.getElementById('noteInput');
        const sendBtn = document.getElementById('sendBtn');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');
        const btnEffect = document.getElementById('btnEffect');
        const themeToggle = document.getElementById('themeToggle');
        const langToggle = document.getElementById('langToggle');
        const historyContainer = document.getElementById('historyContainer');
        const historyList = document.getElementById('historyList');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        // --- Initialization ---
        function init() {
            // Detect System Language
            const sysLang = navigator.language.slice(0, 2);
            currentLang = (sysLang === 'ar') ? 'ar' : 'en';
            
            // Detect System Theme
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
                isDark = false;
            }

            applyLanguage();
            applyTheme();
            loadHistory();
            initCanvasEffect();
        }

        // --- Theme Logic ---
        function applyTheme() {
            if (isDark) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            updateCanvasColors();
        }

        themeToggle.addEventListener('click', () => {
            isDark = !isDark;
            applyTheme();
        });

        // --- Language Logic ---
        function applyLanguage() {
            const t = translations[currentLang];
            
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            
            document.getElementById('appTitle').innerText = t.title;
            document.getElementById('appDesc').innerText = t.desc;
            phoneInput.placeholder = t.placeholder;
            noteInput.placeholder = t.notePlaceholder;
            btnText.innerText = t.btn;
            document.getElementById('historyTitle').innerText = t.historyTitle;
            clearHistoryBtn.innerText = t.clearHistory;
            
            langToggle.innerText = currentLang === 'ar' ? 'EN' : 'عربي';
            
            renderHistory();
        }

        langToggle.addEventListener('click', () => {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            applyLanguage();
        });

        // --- Core Application Logic (Smart Number Parsing) ---
        function generateLink() {
            let rawNumber = phoneInput.value.trim();
            let noteValue = noteInput.value.trim();
            
            // Keep only digits and plus sign
            let cleanNumber = rawNumber.replace(/[^\d+]/g, '');

            if (!cleanNumber) return;

            // --- SMART NUMBER CONVERSION ---
            // If starts with 07 (Local Jordan), convert to 9627
            if (cleanNumber.startsWith('07')) {
                cleanNumber = '962' + cleanNumber.substring(1);
            } 
            // If starts with 00, replace with nothing so it starts directly with country code
            else if (cleanNumber.startsWith('00')) {
                cleanNumber = cleanNumber.substring(2);
            }
            // If starts with +, remove it (WhatsApp prefers pure numbers)
            else if (cleanNumber.startsWith('+')) {
                cleanNumber = cleanNumber.substring(1);
            }

            // UI Feedback
            const originalText = btnText.innerText;
            btnText.innerText = translations[currentLang].btnReady;
            btnIcon.classList.add('hidden');
            btnEffect.classList.remove('-translate-x-full');
            btnEffect.classList.add('translate-x-0');
            
            // Save to history
            saveToHistory(rawNumber, cleanNumber, noteValue);

            // Navigate to WhatsApp after short delay
            setTimeout(() => {
                btnText.innerText = originalText;
                btnIcon.classList.remove('hidden');
                btnEffect.classList.remove('translate-x-0');
                btnEffect.classList.add('-translate-x-full');
                phoneInput.value = '';
                noteInput.value = '';
                
                // Redirect to WhatsApp
                window.location.href = `https://wa.me/${cleanNumber}`;
            }, 800);
        }

        sendBtn.addEventListener('click', generateLink);
        phoneInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') generateLink();
        });
        noteInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') generateLink();
        });

        // --- History / LocalStorage Management ---
        function saveToHistory(displayNum, cleanNum, note) {
            // Remove if exists to avoid duplicates
            history = history.filter(item => item.clean !== cleanNum);
            
            history.unshift({ display: displayNum, clean: cleanNum, note: note, time: new Date().getTime() });
            
            if (history.length > 10) history.pop(); // Keep max 10
            
            localStorage.setItem('0xh_history', JSON.stringify(history));
            renderHistory();
        }

        function loadHistory() {
            try {
                const saved = localStorage.getItem('0xh_history');
                if (saved) {
                    history = JSON.parse(saved);
                    renderHistory();
                }
            } catch (e) {
                console.error("Could not load history", e);
            }
        }

        function renderHistory() {
            historyList.innerHTML = '';
            
            if (history.length === 0) {
                historyContainer.classList.add('hide');
                return;
            }
            
            historyContainer.classList.remove('hide');
            
            history.forEach(item => {
                const li = document.createElement('li');
                li.className = "flex justify-between items-center p-3 bg-white/40 dark:bg-slate-800/40 rounded-xl hover:bg-white/80 dark:hover:bg-slate-700/80 transition-colors cursor-pointer group shadow-sm";
                
                // Container for Text
                const infoDiv = document.createElement('div');
                infoDiv.className = "flex flex-col w-full overflow-hidden text-left rtl:text-right";
                
                // Note display
                if (item.note) {
                    const noteSpan = document.createElement('span');
                    noteSpan.className = "text-xs font-bold text-primaryDark dark:text-primary mb-1 truncate";
                    noteSpan.innerText = item.note;
                    infoDiv.appendChild(noteSpan);
                }

                // Number display
                const numSpan = document.createElement('span');
                numSpan.className = "font-semibold tracking-wider text-slate-700 dark:text-slate-200 dir-ltr text-left";
                numSpan.innerText = item.display || item.clean;
                infoDiv.appendChild(numSpan);
                
                // Action icon
                const icon = document.createElement('div');
                icon.className = "text-primary opacity-0 group-hover:opacity-100 transition-opacity transform group-hover:scale-110 flex-shrink-0 ml-3 rtl:mr-3 rtl:ml-0";
                icon.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>`;
                
                li.appendChild(infoDiv);
                li.appendChild(icon);
                
                // Click to redirect
                li.addEventListener('click', () => {
                    window.location.href = `https://wa.me/${item.clean}`;
                });
                
                historyList.appendChild(li);
            });
        }

        clearHistoryBtn.addEventListener('click', () => {
            history = [];
            localStorage.removeItem('0xh_history');
            renderHistory();
        });

        // --- Beautiful Canvas Background Effect ---
        let animationFrameId;
        let particles = [];
        let colors = [];

        function updateCanvasColors() {
            if (isDark) {
                // Dark mode colors (Blues, Teals, Emeralds)
                colors = ['#10b981', '#34d399', '#3b82f6', '#0ea5e9'];
            } else {
                // Light mode colors (Soft Greens, Yellows)
                colors = ['#10b981', '#86efac', '#fde047', '#34d399'];
            }
            // Update existing particles colors
            particles.forEach(p => {
                p.color = colors[Math.floor(Math.random() * colors.length)];
            });
        }

        function initCanvasEffect() {
            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();
            updateCanvasColors();

            class Particle {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.size = Math.random() * (isDark ? 3 : 8) + 1;
                    this.speedX = (Math.random() - 0.5) * 1.5;
                    this.speedY = (Math.random() - 0.5) * 1.5;
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                    this.angle = Math.random() * 360;
                    this.spin = (Math.random() - 0.5) * 0.05;
                }
                update() {
                    this.angle += this.spin;
                    // Wavy movement using Sine/Cosine
                    this.x += this.speedX + Math.sin(this.angle) * 0.5;
                    this.y += this.speedY + Math.cos(this.angle) * 0.5;
                    
                    // Wrap around screen
                    if (this.x > canvas.width) this.x = 0;
                    if (this.x < 0) this.x = canvas.width;
                    if (this.y > canvas.height) this.y = 0;
                    if (this.y < 0) this.y = canvas.height;
                }
                draw() {
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Create particles
            const particleCount = window.innerWidth < 768 ? 30 : 60;
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                // Dynamic connections
                for (let i = 0; i < particles.length; i++) {
                    particles[i].update();
                    particles[i].draw();
                    
                    for (let j = i; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        
                        if (distance < 100) {
                            ctx.beginPath();
                            ctx.strokeStyle = particles[i].color;
                            ctx.globalAlpha = 0.1;
                            ctx.lineWidth = 0.5;
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.stroke();
                            ctx.globalAlpha = 1.0;
                        }
                    }
                }
                animationFrameId = requestAnimationFrame(animate);
            }
            animate();
        }

        // Run application
        window.onload = init;
    </script>
</body>
</html>
