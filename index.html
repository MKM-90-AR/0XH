    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Cairo', sans-serif;
            transition: background-color 0.5s ease, color 0.5s ease;
            height: 100dvh; /* Use dynamic viewport height */
            overflow: hidden; /* Controlled by JS based on context */
            position: relative;
        }

        /* Glassmorphism Classes */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transform: translateZ(0); /* Hardware acceleration to fix glitching */
        }

        .dark-mode { background-color: #0f172a; color: #f8fafc; }
        .light-mode { background-color: #f0f9ff; color: #1e293b; }
        
        .light-mode .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
            color: #0f172a;
        }

        /* Inputs in Light Mode Fix */
        .light-mode input, .light-mode select { color: #0f172a; font-weight: bold; }
        .light-mode select option { background-color: #f0f9ff; color: #0f172a; }

        /* Background Particles */
        #particles {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }
        
        .particle { position: absolute; border-radius: 50%; animation: float-up linear infinite; }
        .dark-mode .particle { background-color: rgba(37, 211, 102, 0.4); box-shadow: 0 0 10px rgba(37, 211, 102, 0.2); }
        .light-mode .particle { background-color: rgba(14, 165, 233, 0.3); box-shadow: 0 0 10px rgba(14, 165, 233, 0.2); }

        @keyframes float-up {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) translateX(50px); opacity: 0; }
        }

        /* Navbar & Animations */
        .navbar {
            position: fixed; top: 0; left: 0; right: 0;
            z-index: 50; transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            background: inherit;
        }
        .navbar::before {
            content: ''; position: absolute; inset: 0;
            background: inherit; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05); z-index: -1;
        }

        /* Sun and Moon specific animations */
        .celestial-body {
            position: absolute; display: flex; justify-content: center; align-items: center;
            width: 100%; height: 100%;
        }

        @keyframes slideDownOut { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(30px); opacity: 0; } }
        @keyframes slideDownIn { 0% { transform: translateY(-30px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }

        .animate-out { animation: slideDownOut 0.4s forwards; }
        .animate-in { animation: slideDownIn 0.4s forwards; }
        .hide { display: none; }

        /* Sun Design */
        .sun {
            width: 20px; height: 20px; background: #FDB813; border-radius: 50%;
            box-shadow: 0 0 15px #FDB813, 0 0 30px #FDB813;
        }
        /* Moon Design */
        .moon {
            width: 20px; height: 20px; background: transparent; border-radius: 50%;
            box-shadow: inset -6px -2px 0 0 #e2e8f0; filter: drop-shadow(0 0 5px rgba(255,255,255,0.5));
            transform: rotate(-15deg);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); }
        ::-webkit-scrollbar-thumb { background: rgba(37, 211, 102, 0.5); border-radius: 10px; }
        
        /* Modals & Toasts */
        .modal { background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); }
        .toast-container { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast {
            background: rgba(220, 38, 38, 0.9); color: white; padding: 12px 24px; border-radius: 12px;
            font-weight: bold; font-size: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); backdrop-filter: blur(5px);
            animation: toastIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes toastIn { from { opacity: 0; transform: translateY(-20px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes toastOut { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(0.9); } }

        .custom-checkbox { accent-color: #25D366; width: 1.2rem; height: 1.2rem; }
        
        /* Layout Utilities */
        .no-flicker { transform: translateZ(0); -webkit-font-smoothing: antialiased; }
    </style>
</head>

        // --- Core & Initialization ---
        function init() {
            createParticles();
            applyLanguage();
            setupInputListeners();
            updateViewMode();
            
            // Re-render data
            renderLocationOptions();
            
            // Check clipboard on focus if supported
            document.getElementById('phoneInput').addEventListener('focus', checkClipboard);
            
            // Listen for window resize to adjust scroll behavior
            window.addEventListener('resize', updateViewMode);
        }

        // --- Smart Scroll / Display Logic ---
        function updateViewMode() {
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
            const isDesktop = window.innerWidth >= 768; // Tailwind md breakpoint
            const body = document.body;

            // If it's a PWA OR a Desktop/Tablet, lock body scroll to make it behave like an app.
            // (The individual views use overflow-y-auto where needed)
            if (isStandalone || isDesktop) {
                body.style.overflow = 'hidden';
            } else {
                // Regular mobile web browser, allow normal scrolling if content overflows
                body.style.overflow = '';
            }
        }

        // --- UI Interactions (Views, Toast) ---
        function openView(viewId) {
            document.getElementById('mainView').classList.add('hidden');
            document.getElementById('locationsView').classList.add('hidden');
            document.getElementById('historyView').classList.add('hidden');
            document.getElementById('helpView').classList.add('hidden');
            
            document.getElementById(viewId).classList.remove('hidden');
            window.scrollTo(0,0);

            if(viewId === 'locationsView') renderLocationsList();
            if(viewId === 'historyView') renderDetailedHistory();
        }

        function closeViews() {
            document.getElementById('locationsView').classList.add('hidden');
            document.getElementById('historyView').classList.add('hidden');
            document.getElementById('helpView').classList.add('hidden');
            document.getElementById('mainView').classList.remove('hidden');
            window.scrollTo(0,0);
        }

        function showToast(message) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = message;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'toastOut 0.3s forwards';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // --- Language & Theme ---
        document.getElementById('langToggle').addEventListener('click', () => {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.getElementById('langToggle').innerText = currentLang === 'ar' ? 'EN' : 'عربي';
            applyLanguage();
        });

        document.getElementById('themeToggle').addEventListener('click', () => {
            isDarkMode = !isDarkMode;
            const body = document.getElementById('body');
            const sun = document.getElementById('sunIcon');
            const moon = document.getElementById('moonIcon');

            if (isDarkMode) {
                body.classList.replace('light-mode', 'dark-mode');
                sun.classList.replace('animate-in', 'animate-out');
                setTimeout(() => { sun.classList.add('hide'); moon.classList.remove('hide', 'animate-out'); moon.classList.add('animate-in'); }, 300);
            } else {
                body.classList.replace('dark-mode', 'light-mode');
                moon.classList.replace('animate-in', 'animate-out');
                setTimeout(() => { moon.classList.add('hide'); sun.classList.remove('hide', 'animate-out'); sun.classList.add('animate-in'); }, 300);
            }
        });

        // --- Input Validations & Clipboard ---
        function setupInputListeners() {
            // Remove spaces in real-time
            document.getElementById('phoneInput').addEventListener('input', function(e) {
                this.value = this.value.replace(/\s+/g, '');
            });

            // Restrict name length
            document.getElementById('nameHint').addEventListener('input', function(e) {
                if(this.value.length > 12) {
                    this.value = this.value.substring(0, 12);
                    showToast(translations[currentLang].errorNameLength);
                }
            });
        }

        async function checkClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                if (text && text !== lastClipboardText) {
                    // Check if it looks like a phone number (mostly digits/plus/spaces)
                    const cleanText = text.replace(/\s+/g, '');
                    if (/^[\d+]{6,15}$/.test(cleanText)) {
                        document.getElementById('phoneInput').value = cleanText;
                        lastClipboardText = text;
                    }
                }
            } catch (err) {
                // Clipboard API might not be permitted, fail silently
            }
        }

        // --- Particles ---
        function createParticles() {
            const container = document.getElementById('particles');
            for(let i=0; i<15; i++) {
                let div = document.createElement('div');
                div.className = 'particle';
                let size = Math.random() * 8 + 4;
                div.style.width = size + 'px';
                div.style.height = size + 'px';
                div.style.left = Math.random() * 100 + 'vw';
                div.style.bottom = '-20px'; // Start from bottom
                div.style.animationDuration = (Math.random() * 15 + 10) + 's'; // Slower movement
                // Use negative delay so they appear instantly spread across the screen
                div.style.animationDelay = '-' + (Math.random() * 20) + 's'; 
                container.appendChild(div);
            }
        }

        // --- Main Transfer Logic ---
        function handleSend() {
            let phone = document.getElementById('phoneInput').value.replace(/\s+/g, '').replace(/[^0-9+]/g, '');
            let name = document.getElementById('nameHint').value.trim();
            let selectedLocId = document.getElementById('selectedLocation').value;
            
            if (!phone) { showToast(translations[currentLang].errorEmptyPhone); return; }
            if (phone.length < 6) { showToast(translations[currentLang].errorShortPhone); return; }
            if (phone.length > 15) { showToast(translations[currentLang].errorLongPhone); return; }
            if (name.length > 12) { showToast(translations[currentLang].errorNameLength); return; }

            // Smart Jordan Code detection (07 -> 9627)
            if (phone.startsWith('07') && phone.length === 10) {
                phone = '962' + phone.substring(1);
            } else if (phone.startsWith('00')) {
                phone = phone.substring(2);
            }

            // Prepare WhatsApp transition function
            const executeTransfer = (textParam, sentLocName) => {
                // Save to history
                const existingIndex = history.findIndex(item => item.phone === phone);
                if (existingIndex > -1) {
                    history[existingIndex].name = name || history[existingIndex].name;
                    history[existingIndex].date = new Date().toISOString();
                    if(sentLocName) history[existingIndex].lastLoc = sentLocName;
                } else {
                    history.unshift({
                        id: Date.now().toString(),
                        phone: phone,
                        name: name,
                        date: new Date().toISOString(),
                        lastLoc: sentLocName || null,
                        note: ""
                    });
                }
                
                if(history.length > 100) history.pop();
                localStorage.setItem('0xh_history', JSON.stringify(history));

                // Visual Feedback
                const btn = document.getElementById('sendBtn');
                const btnText = document.getElementById('btnText');
                btn.classList.add('scale-95', 'opacity-80');
                btnText.innerText = translations[currentLang].readyBtn;
                
                setTimeout(() => {
                    btn.classList.remove('scale-95', 'opacity-80');
                    btnText.innerText = translations[currentLang].transferBtn;
                    
                    // Clear inputs for next use
                    document.getElementById('phoneInput').value = '';
                    document.getElementById('nameHint').value = '';
                    document.getElementById('selectedLocation').value = '';
                    
                    window.location.href = `https://wa.me/${phone}${textParam}`;
                }, 800);
            };

            // Handle Location Logic
            if (selectedLocId === 'GPS_CURRENT') {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            const lat = position.coords.latitude;
                            const lng = position.coords.longitude;
                            const mapLink = `https://maps.google.com/?q=${lat},${lng}`;
                            executeTransfer(`?text=${encodeURIComponent(mapLink)}`, translations[currentLang].gpsCurrent.replace("📍 ", ""));
                        },
                        (error) => {
                            showToast(translations[currentLang].errorGPS);
                        },
                        { enableHighAccuracy: true, timeout: 5000 }
                    );
                } else {
                    showToast(translations[currentLang].errorGPS);
                }
            } else if (selectedLocId) {
                const loc = savedLocations.find(l => l.id === selectedLocId);
                if (loc) {
                    const messageContent = loc.message ? `${loc.message}\n${loc.link}` : loc.link;
                    executeTransfer(`?text=${encodeURIComponent(messageContent)}`, loc.name);
                } else {
                    executeTransfer("", null);
                }
            } else {
                executeTransfer("", null);
            }
        }

        // --- Location Management ---
        function renderLocationOptions() {
            const select = document.getElementById('selectedLocation');
            const currentVal = select.value;
            
            const noLocText = translations[currentLang].noLocationSelected;
            const gpsText = translations[currentLang].gpsCurrent;
            
            select.innerHTML = `
                <option value="">${noLocText}</option>
                <option value="GPS_CURRENT" class="text-blue-500 font-bold">${gpsText}</option>
            `;
            
            savedLocations.forEach(loc => {
                const opt = document.createElement('option');
                opt.value = loc.id;
                opt.textContent = loc.name;
                select.appendChild(opt);
            });
            
            // Restore selection if still valid
            if (Array.from(select.options).some(opt => opt.value === currentVal)) {
                select.value = currentVal;
            }
        }

        function renderLocationsList() {
            const container = document.getElementById('locationsListContainer');
            container.innerHTML = '';
            
            if(savedLocations.length === 0) {
                container.innerHTML = `<div class="text-center opacity-50 py-4 font-bold">${currentLang === 'ar' ? 'لا توجد مواقع محفوظة' : 'No saved locations'}</div>`;
                return;
            }

            savedLocations.forEach(loc => {
                const div = document.createElement('div');
                div.className = "bg-white/5 p-4 rounded-xl border border-white/10 relative";
                div.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <h4 class="font-black text-lg text-[#25D366]">${loc.name}</h4>

                            <button onclick="openLocManageModal('${loc.id}')" class="text-blue-400 hover:text-blue-300 w-8 h-8 rounded-full bg-blue-500/10 flex items-center justify-center transition">
                                <i class="fas fa-pen"></i>
                            </button>

                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                    <div class="text-sm opacity-70 mb-1" dir="ltr"><i class="fas fa-link mr-1"></i> ${loc.link}</div>
                    ${loc.message ? `<div class="text-xs opacity-60 bg-black/20 p-2 rounded mt-2"><i class="fas fa-comment-alt ml-1"></i> ${loc.message}</div>` : ''}

        function openLocManageModal(id = null) {
            const titleEl = document.getElementById('locModalTitle');
            const idInput = document.getElementById('locEditId');
            const nameInput = document.getElementById('locNameInput');
            const linkInput = document.getElementById('locLinkInput');
            const msgInput = document.getElementById('locMessageInput');
            
            if (id) {
                const loc = savedLocations.find(l => l.id === id);
                if(loc) {
                    titleEl.innerText = translations[currentLang].editLocationBtn;
                    idInput.value = loc.id;
                    nameInput.value = loc.name;
                    linkInput.value = loc.link;
                    msgInput.value = loc.message || '';
                }

                titleEl.innerText = translations[currentLang].addLocationBtn;
                idInput.value = '';

                linkInput.value = '';
                msgInput.value = '';

            const modal = document.getElementById('locManageModal');

            content.classList.add('scale-95');

        function saveLocation() {
            const id = document.getElementById('locEditId').value;
            const name = document.getElementById('locNameInput').value.trim();
            const link = document.getElementById('locLinkInput').value.trim();
            const message = document.getElementById('locMessageInput').value.trim();

            if(!name || !link) { showToast(translations[currentLang].errorLocFields); return; }
            if(name.length > 12) { showToast(translations[currentLang].errorLocNameLength); return; }

            if(id) {
                const index = savedLocations.findIndex(l => l.id === id);
                if(index > -1) {
                    savedLocations[index] = { id, name, link, message };
                }
            } else {
                savedLocations.push({ id: Date.now().toString(), name, link, message });
            }
            
            localStorage.setItem('0xh_locations', JSON.stringify(savedLocations));
            closeLocManageModal();
            renderLocationOptions();
            renderLocationsList();
        }

        // --- History Logic ---
        function getRelativeDateStr(isoString) {
            const d = new Date(isoString);
            const today = new Date();
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);

            if (d.toDateString() === today.toDateString()) return translations[currentLang].todayStr;
            if (d.toDateString() === yesterday.toDateString()) return translations[currentLang].yesterdayStr;
            
            return d.toLocaleDateString(currentLang === 'ar' ? 'ar-JO' : 'en-US', { day: 'numeric', month: 'short' });
        }

        function renderDetailedHistory() {
            const container = document.getElementById('detailedHistoryList');
            container.innerHTML = '';
            const filter = document.getElementById('historyFilter').value;
            
            const today = new Date().toDateString();
            const yesterday = new Date(new Date().setDate(new Date().getDate() - 1)).toDateString();
            
            let filteredHistory = history.filter(item => {
                const itemDate = new Date(item.date).toDateString();
                if (filter === 'today') return itemDate === today;
                if (filter === 'yesterday') return itemDate === yesterday;
                return true;
            });

            if (filteredHistory.length === 0) {
                container.innerHTML = `<div class="text-center opacity-50 py-4 font-bold">${currentLang === 'ar' ? 'لا يوجد سجل مطابق' : 'No records found'}</div>`;
                return;
            }

            filteredHistory.forEach(item => {
                const div = document.createElement('div');
                div.className = `bg-white/5 p-4 rounded-xl border ${selectedIds.has(item.id) ? 'border-blue-500' : 'border-white/10'} relative flex flex-col`;
                
                const timeStr = new Date(item.date).toLocaleTimeString(currentLang === 'ar' ? 'ar-JO' : 'en-US', { hour: '2-digit', minute: '2-digit' });
                const dateStr = getRelativeDateStr(item.date);
                
                let checkboxHTML = selectionMode ? 
                    `<input type="checkbox" class="custom-checkbox absolute top-4 left-4 rtl:right-4 rtl:left-auto" onchange="toggleSelection('${item.id}', this.checked)" ${selectedIds.has(item.id) ? 'checked' : ''}>` : '';

                let locBadge = item.lastLoc ? 
                    `<div class="inline-block bg-blue-500/20 text-blue-300 text-xs px-2 py-1 rounded mt-1 font-bold"><i class="fas fa-map-marker-alt"></i> ${translations[currentLang].sentLocPrefix} ${item.lastLoc}</div>` : '';

                div.innerHTML = `
                    ${checkboxHTML}
                    <div class="${selectionMode ? 'pl-8 rtl:pr-8' : ''}">
                        <div class="flex justify-between items-start mb-1">
                            <div class="text-xs opacity-50">${translations[currentLang].addedPrefix} ${dateStr}, ${timeStr}</div>
                            <div class="flex gap-2 ${selectionMode ? 'hidden' : ''}">
                                <button onclick="openEditHistoryModal('${item.id}')" class="text-blue-400 hover:text-blue-300 w-7 h-7 rounded bg-blue-500/10 flex items-center justify-center transition"><i class="fas fa-pen text-xs"></i></button>
                                <button onclick="confirmDelete('${item.id}', 'HIST')" class="text-red-400 hover:text-red-300 w-7 h-7 rounded bg-red-500/10 flex items-center justify-center transition"><i class="fas fa-trash text-xs"></i></button>
                            </div>
                        </div>
                        <h4 class="font-black text-2xl tracking-wider my-1" dir="ltr">${item.phone}</h4>
                        ${item.name ? `<div class="font-bold text-[#25D366] text-sm">${item.name}</div>` : ''}
                        ${locBadge}
                        ${item.note ? `<div class="mt-2 text-xs opacity-80 bg-black/20 p-2 rounded italic">${item.note}</div>` : ''}
                    </div>
                    <button onclick="window.location.href='https://wa.me/${item.phone.replace('+','')}'" class="mt-3 w-full bg-white/10 hover:bg-white/20 font-bold py-2 rounded-lg text-sm transition flex justify-center items-center gap-2 ${selectionMode ? 'hidden' : ''}">
                        <i class="fab fa-whatsapp"></i> ${translations[currentLang].quickMsgBtn}
                    </button>
                `;
                container.appendChild(div);
            });
        }

        // --- History Modals ---
        function openEditHistoryModal(id) {

            document.getElementById('editHistPhone').value = '+' + item.phone;

            document.getElementById('editHistNote').value = item.note || '';
            
            const modal = document.getElementById('editHistoryModal');
            const content = document.getElementById('editHistoryModalContent');
            modal.classList.remove('hidden');
            setTimeout(() => content.classList.remove('scale-95'), 10);
        }

        function closeEditHistoryModal() {
            const modal = document.getElementById('editHistoryModal');
            const content = document.getElementById('editHistoryModalContent');
            content.classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function saveHistoryEdit() {
            const id = document.getElementById('editHistId').value;
            const name = document.getElementById('editHistName').value.trim();
            const note = document.getElementById('editHistNote').value.trim();
            
            if(name.length > 12) { showToast(translations[currentLang].errorNameLength); return; }

            const index = history.findIndex(h => h.id === id);
            if (index > -1) {
                history[index].name = name;
                history[index].note = note;
                localStorage.setItem('0xh_history', JSON.stringify(history));
                renderDetailedHistory();
            }
            closeEditHistoryModal();
        }

        // --- Global Delete Logic ---
        function confirmDelete(id, context) {
            itemToDelete = id;
            deleteContext = context; // 'LOC' or 'HIST'
            showDeleteModal();
        }

        function confirmDeleteAll() {
            if (history.length === 0) return;
            itemToDelete = 'ALL';
            deleteContext = 'HIST';
            showDeleteModal();
        }

        function executeMultiDelete() {
            if (selectedIds.size === 0) return;
            itemToDelete = 'MULTI';
            deleteContext = 'HIST';
            showDeleteModal();
        }

        function showDeleteModal() {
            const modal = document.getElementById('deleteModal');
            const content = document.getElementById('deleteModalContent');
            modal.classList.remove('hidden');
            setTimeout(() => content.classList.remove('scale-95'), 10);

            document.getElementById('confirmDeleteBtn').onclick = function() {
                if(deleteContext === 'LOC') {
                    savedLocations = savedLocations.filter(l => l.id !== itemToDelete);
                    localStorage.setItem('0xh_locations', JSON.stringify(savedLocations));
                    renderLocationsList();
                    renderLocationOptions();
                } else if (deleteContext === 'HIST') {
                    if (itemToDelete === 'ALL') {
                        history = [];
                    } else if (itemToDelete === 'MULTI') {
                        history = history.filter(h => !selectedIds.has(h.id));
                        toggleSelectionUI();
                    } else {
                        history = history.filter(h => h.id !== itemToDelete);
                    }
                    localStorage.setItem('0xh_history', JSON.stringify(history));
                    renderDetailedHistory();
                }
                closeDeleteModal();
            };
        }

        function closeDeleteModal() {
            const modal = document.getElementById('deleteModal');
            const content = document.getElementById('deleteModalContent');
            content.classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
            itemToDelete = null;
            deleteContext = null;
        }

        // Run
        window.onload = init;
    </script>
</body>
</html>
