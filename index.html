<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>

    <meta name="apple-mobile-web-app-title" content="0xh">

    <link rel="apple-touch-icon" href="0XH.jpg">
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%220xh%20WhatsApp%20Direct%22%2C%22short_name%22%3A%220xh%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230f172a%22%2C%22theme_color%22%3A%22%2325D366%22%2C%22icons%22%3A%5B%7B%22src%22%3A%220XH.jpg%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fjpeg%22%7D%5D%7D">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Cairo', sans-serif;
            transition: background-color 0.5s ease, color 0.5s ease;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .dark-mode {
            background-color: #0f172a;
            color: #f8fafc;
        }

        .light-mode {
            background-color: #f0f9ff;
            color: #0f172a;
        }
        
        .light-mode .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
            color: #1e293b;
        }

        /* Readable text fixes for inputs in light mode */
        .light-mode input, .light-mode select, .light-mode textarea {
            color: #111827 !important; 
            background-color: rgba(255,255,255,0.7) !important;
            border-color: rgba(0,0,0,0.1) !important;
        }
        .light-mode input::placeholder, .light-mode textarea::placeholder {
            color: #6b7280 !important;
        }
        .light-mode .text-white {
            color: #1e293b !important;
        }

        /* Navbar Header (Top Sticky with Hide/Show Animation) */
        #topNavbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            transition: transform 0.4s ease-in-out, background-color 0.3s;
        }
        .navbar-hidden {
            transform: translateY(-100%);
        }

        /* Header Logo Styling */
        .header-logo {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #25D366;
            box-shadow: 0 0 10px rgba(37, 211, 102, 0.5);
            transition: transform 0.5s ease;
        }
        .header-logo:hover {
            transform: rotate(360deg);
        }

        /* Fix button flicker (hardware acceleration) */
        .no-flicker {
            transform: translateZ(0);
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }

        /* Particles - Instantly Generated */
        #particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        
        .particle { 
            position: absolute; 
            border-radius: 50%; 
            animation: float-up linear infinite; 
        }
        
        .dark-mode .particle { background-color: rgba(37, 211, 102, 0.3); }
        .light-mode .particle { background-color: rgba(14, 165, 233, 0.2); }

        @keyframes float-up {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-120vh) translateX(30px); opacity: 0; }
        }

        /* Sun and Moon animations */
        .celestial-body {
            position: absolute; display: flex; justify-content: center; align-items: center;
            width: 100%; height: 100%; top: 0; left: 0;
        }
        .moon {
            width: 22px; height: 22px; background: #e2e8f0; border-radius: 50%;
            box-shadow: 0 0 10px rgba(255,255,255,0.5) inset; position: relative; overflow: hidden;
        }
        .moon::before {
            content: ''; position: absolute; width: 6px; height: 6px; background: rgba(0,0,0,0.15);
            border-radius: 50%; top: 3px; left: 3px;
            box-shadow: 7px 5px 0 -1px rgba(0,0,0,0.15);
        }
        .sun {
            width: 22px; height: 22px; background: #FDB813; border-radius: 50%;
            box-shadow: 0 0 12px #FDB813;
        }

        @keyframes slideDownOut {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(30px); opacity: 0; }
        }
        @keyframes slideDownIn {
            0% { transform: translateY(-30px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        .animate-out { animation: slideDownOut 0.3s forwards; }
        .animate-in { animation: slideDownIn 0.3s forwards; }
        .hide { display: none !important; }

        /* Toast notifications container fixed at top */
        #toast-container {
            position: fixed;
            top: 75px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
            width: 90%;
            max-width: 400px;
        }
        .toast {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border-bottom: 3px solid #ef4444; 
            opacity: 0;
            transform: translateY(-20px);
            animation: toastEnter 0.3s forwards;
            direction: rtl; 
        }
        .toast.success { border-bottom-color: #25D366; }
        @keyframes toastEnter { to { opacity: 1; transform: translateY(0); } }
        @keyframes toastExit { to { opacity: 0; transform: translateY(-20px); } }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: #25D366; border-radius: 10px; }
        
        .modal { background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); }
        .custom-checkbox { accent-color: #25D366; width: 1.2rem; height: 1.2rem; }
    </style>
</head>

            <div class="flex gap-2">

                <button onclick="closeEditHistoryModal()" class="flex-1 bg-white/10 hover:bg-white/20 font-bold py-2 rounded-lg transition" data-i18n="cancelBtn">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- Delete Modal -->
    <div id="deleteModal" class="fixed inset-0 modal hidden flex justify-center items-center z-50 px-4">
        <div class="glass-panel p-6 rounded-2xl w-full max-w-sm text-center transform scale-95 transition-transform duration-300" id="deleteModalContent">
            <div class="text-red-400 text-4xl mb-3"><i class="fas fa-exclamation-triangle"></i></div>
            <h3 class="text-lg font-bold mb-2" data-i18n="confirmDeleteTitle">تأكيد الحذف</h3>
            <p class="text-sm opacity-80 mb-5" data-i18n="confirmDeleteMsg">هل أنت متأكد من الحذف؟</p>
            <div class="flex gap-2">
                <button id="confirmDeleteBtn" class="flex-1 bg-red-500 text-white font-bold py-2 rounded-lg hover:bg-red-600 transition" data-i18n="yesDelete">نعم، احذف</button>
                <button onclick="closeDeleteModal()" class="flex-1 bg-white/10 hover:bg-white/20 font-bold py-2 rounded-lg transition" data-i18n="cancelBtn">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        // --- State ---
        let isDarkMode = true;
        let currentLang = 'ar';
        let history = JSON.parse(localStorage.getItem('0xh_history')) || [];
        let savedLocations = JSON.parse(localStorage.getItem('0xh_locations')) || [];
        let itemToDelete = null; 
        let selectionMode = false;
        let selectedIds = new Set();
        let lastScrollTop = 0;

        const translations = {
            ar: {
                phonePlaceholder: "أدخل الرقم (مثال: 079...)",
                namePlaceholder: "اسم الشخص أو تلميح (اختياري)",
                transferBtn: "تحويل ومراسلة",
                readyBtn: "جاهز! جاري النقل...",
                loadingGps: "جاري التحديد...",
                openHistoryBtn: "سجل الأرقام السابقة",
                manageLocationsBtn: "إدارة المواقع المحفوظة",
                historyTitle: "سجل الأرقام",
                clearHistory: "مسح السجل بالكامل",
                selectBtn: "تحديد للحذف",
                cancelBtn: "إلغاء",
                deleteSelected: "حذف المحدد",
                watermark: "تم تطوير هذا الموقع بواسطه mkm",
                editTitle: "تعديل السجل",
                phoneNumber: "رقم الهاتف",
                nameHintLabel: "الاسم / التلميح",
                notesLabel: "الملاحظات",
                saveBtn: "حفظ",
                confirmDeleteTitle: "تأكيد الحذف",
                confirmDeleteMsg: "هل أنت متأكد أنك تريد الحذف؟",
                yesDelete: "نعم، احذف",
                howToUseBtn: "كيف أستخدم الموقع؟",
                helpTitle: "دليل الاستخدام",
                returnTop: "العودة للرئيسية",
                returnBottom: "العودة للصفحة الرئيسية",
                manageLocationsTitle: "إدارة المواقع الجغرافية",
                addLocationBtn: "إضافة موقع جديد",
                noLocationSelected: "بدون إرفاق موقع",
                currentGpsOption: "📍 إرفاق موقعي الحالي (GPS)",
                filterAll: "عرض الكل",
                filterToday: "اليوم",
                filterYesterday: "البارحة",
                errorEmptyPhone: "يرجى إدخال رقم الهاتف أولاً",

                loadingGps: "Locating...",
                openHistoryBtn: "Previous Numbers History",
                manageLocationsBtn: "Manage Saved Locations",
                historyTitle: "Numbers History",
                clearHistory: "Clear All History",
                selectBtn: "Select to Delete",
                cancelBtn: "Cancel",
                deleteSelected: "Delete Selected",
                watermark: "Developed by mkm",
                editTitle: "Edit Record",
                phoneNumber: "Phone Number",
                nameHintLabel: "Name / Hint",
                notesLabel: "Notes",
                saveBtn: "Save",
                confirmDeleteTitle: "Confirm Deletion",
                confirmDeleteMsg: "Are you sure you want to delete?",
                yesDelete: "Yes, Delete",
                howToUseBtn: "How to use the site?",
                helpTitle: "User Guide",
                returnTop: "Return to Main",
                returnBottom: "Return to Main Page",
                manageLocationsTitle: "Manage Locations",

                filterToday: "Today",

                errorShortPhone: "Entered number is too short",
                errorLongPhone: "Entered number is too long (max 15 digits)",
                errorNameLength: "Name cannot exceed 12 characters",
                toastGpsError: "Could not access location. Ensure GPS is enabled.",

                lblAdded: "Added:",
                lblToday: "Today",
                lblYesterday: "Yesterday"
            }
        };

        function init() {
            createParticlesInstant();
            renderLocations();
            applyLanguage();
            setupNavbarScroll();
            setupClipboardIntelligence();
            
            window.addEventListener('hashchange', handleRouting);
            handleRouting();
        }

        // --- Instant Particles from bottom ---
        function createParticlesInstant() {
            const container = document.getElementById('particles');
            if (!container) return;
            container.innerHTML = '';
            for(let i=0; i<20; i++) {
                let div = document.createElement('div');
                div.className = 'particle';
                let size = Math.random() * 8 + 4;
                div.style.width = size + 'px';
                div.style.height = size + 'px';
                div.style.left = Math.random() * 100 + 'vw';
                div.style.bottom = '-20px'; // Start exactly at bottom
                div.style.animationDuration = (Math.random() * 8 + 4) + 's';
                
                // NEGATIVE delay makes them instantly appear spread out across the screen
                div.style.animationDelay = '-' + (Math.random() * 10) + 's';
                
                container.appendChild(div);
            }
        }

        // --- Navbar hide/show on scroll ---
        function setupNavbarScroll() {
            const navbar = document.getElementById('topNavbar');
            window.addEventListener('scroll', () => {
                let st = window.pageYOffset || document.documentElement.scrollTop;
                if (st > lastScrollTop && st > 50) {
                    navbar.classList.add('navbar-hidden'); // Scrolling down
                } else {
                    navbar.classList.remove('navbar-hidden'); // Scrolling up
                }
                lastScrollTop = st <= 0 ? 0 : st;
            }, false);
        }

        function showToast(message, isError = true) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${isError ? '' : 'success'}`;
            const icon = isError ? '<i class="fas fa-exclamation-circle text-red-400 ml-2 rtl:mr-2"></i>' 
                                 : '<i class="fas fa-check-circle text-green-400 ml-2 rtl:mr-2"></i>';
            toast.innerHTML = `<div class="flex items-center">${icon} ${message}</div>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'toastExit 0.3s forwards';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function setupClipboardIntelligence() {
            const phoneInput = document.getElementById('phoneInput');
            const nameHint = document.getElementById('nameHint');
            
            phoneInput.addEventListener('input', function() {
                this.value = this.value.replace(/\s+/g, '');
            });

            phoneInput.addEventListener('focus', async function() {
                if(this.value === '') {
                    try {
                        const text = await navigator.clipboard.readText();
                        if(text) {
                            const cleaned = text.replace(/[\s-]/g, '');
                            if (/^\+?[0-9]{7,15}$/.test(cleaned)) {
                                this.value = cleaned;
                                showToast(currentLang === 'ar' ? 'تم لصق الرقم من الحافظة تلقائياً' : 'Number pasted from clipboard', false);
                            }
                        }
                    } catch (err) { }
                }
            });

            nameHint.addEventListener('input', function() {
                if(this.value.length >= 12) {
                    this.value = this.value.substring(0, 12);
                    showToast(translations[currentLang].errorNameLength, true);
                }
            });
        }

        function handleRouting() {
            const main = document.getElementById('mainView');
            const help = document.getElementById('helpView');
            const hist = document.getElementById('historyView');
            const locs = document.getElementById('locationsView');
            
            main.classList.add('hidden');
            help.classList.add('hidden');
            hist.classList.add('hidden');
            locs.classList.add('hidden');

            if(window.location.hash === '#help') {
                help.classList.remove('hidden');
            } else if(window.location.hash === '#history') {
                hist.classList.remove('hidden');
                renderHistoryDetailed(); 
            } else if(window.location.hash === '#locations') {
                locs.classList.remove('hidden');
                renderLocationsManager(); 
            } else {
                main.classList.remove('hidden');
            }
            window.scrollTo(0,0);
        }
        
        function openHelp() { window.location.hash = 'help'; }
        function openHistoryView() { window.location.hash = 'history'; }
        function openLocationsView() { window.location.hash = 'locations'; }
        function closeViews() { window.location.hash = ''; selectionMode = false; }

        document.getElementById('themeToggle').addEventListener('click', () => {
            isDarkMode = !isDarkMode;
            const body = document.getElementById('body');
            const sun = document.getElementById('sunIcon');
            const moon = document.getElementById('moonIcon');

            if (isDarkMode) {
                body.classList.replace('light-mode', 'dark-mode');
                sun.classList.remove('animate-in'); sun.classList.add('animate-out');
                setTimeout(() => {
                    sun.classList.add('hide');
                    moon.classList.remove('hide', 'animate-out'); moon.classList.add('animate-in');
                }, 300);
            } else {
                body.classList.replace('dark-mode', 'light-mode');
                moon.classList.remove('animate-in'); moon.classList.add('animate-out');
                setTimeout(() => {
                    moon.classList.add('hide');
                    sun.classList.remove('hide', 'animate-out'); sun.classList.add('animate-in');
                }, 300);
            }
        });

        document.getElementById('langToggle').addEventListener('click', () => {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.getElementById('langToggle').innerText = currentLang === 'ar' ? 'EN' : 'عربي';
            applyLanguage();
        });

        function applyLanguage() {
            document.getElementById('html-root').setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
            document.getElementById('html-root').setAttribute('lang', currentLang);
            
            document.getElementById('phoneInput').placeholder = translations[currentLang].phonePlaceholder;
            document.getElementById('nameHint').placeholder = translations[currentLang].namePlaceholder;
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if(translations[currentLang][key]) {
                    if(el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                        el.placeholder = translations[currentLang][key];
                    } else {
                        el.innerText = translations[currentLang][key];
                    }
                }
            });

            if(currentLang === 'en') {
                document.getElementById('helpContent').innerHTML = `
                    <div><h3 class="font-bold text-lg text-blue-400 mb-1"><i class="fas fa-bolt"></i> Smart Routing:</h3><p>App instantly removes spaces. Local formats (e.g. 079) convert to +962 automatically.</p></div>
                    <div><h3 class="font-bold text-lg text-green-400 mb-1"><i class="fas fa-map-marker-alt"></i> Attach Location:</h3><p>Manage saved maps via "Manage Locations". Select one before sending, or use GPS.</p></div>
                    <div><h3 class="font-bold text-lg text-red-400 mb-1"><i class="fas fa-exclamation-triangle"></i> Important Data Warning:</h3><p>All history and saved locations are stored locally in your browser's LocalStorage. Clearing browser cookies or cache will permanently delete these records. Make sure not to clear site data if you want to keep your history!</p></div>
                `;
            } else {
                document.getElementById('helpContent').innerHTML = `
                    <div><h3 class="font-bold text-lg text-blue-400 mb-1"><i class="fas fa-bolt"></i> اللصق الذكي وحذف المسافات:</h3><p>بمجرد نسخ رقم ولصقه سيتم حذف أي مسافات تلقائياً. الأرقام المحلية (079) تتحول تلقائياً لمفتاح الأردن 962.</p></div>
                    <div><h3 class="font-bold text-lg text-green-400 mb-1"><i class="fas fa-map-marker-alt"></i> إرفاق الموقع (GPS):</h3><p>قم بإدارة مواقعك عبر نافذة "إدارة المواقع"، أو اختر إرسال موقعك الحالي.</p></div>
                    <div><h3 class="font-bold text-lg text-red-400 mb-1"><i class="fas fa-exclamation-triangle"></i> تحذير هام بشأن الحفظ (LocalStorage):</h3><p>يتم تخزين السجل والمواقع المحفوظة محلياً داخل متصفحك فقط. تنبيه: قيامك بمسح بيانات المتصفح (Cookies / Cache) أو وضع التصفح الخفي قد يؤدي إلى فقدان وحذف جميع هذه المعلومات والبيانات نهائياً!</p></div>
                `;
            }
            renderLocations();
        }

        function openLocManageModal(id = null) {
            const title = document.getElementById('locModalTitle');
            if (id) {
                const loc = savedLocations.find(l => l.id === id);
                document.getElementById('locModalId').value = loc.id;
                document.getElementById('modalLocName').value = loc.name;
                document.getElementById('modalLocLink').value = loc.link;
                document.getElementById('modalLocMessage').value = loc.message || '';
                title.innerText = currentLang === 'ar' ? 'تعديل الموقع' : 'Edit Location';
            } else {
                document.getElementById('locModalId').value = '';
                document.getElementById('modalLocName').value = '';
                document.getElementById('modalLocLink').value = '';
                document.getElementById('modalLocMessage').value = '';
                title.innerText = translations[currentLang].addLocationBtn;
            }
            document.getElementById('locManageModal').classList.remove('hidden');
        }

        function closeLocManageModal() { document.getElementById('locManageModal').classList.add('hidden'); }

        function saveLocationModal() {
            const id = document.getElementById('locModalId').value;
            const name = document.getElementById('modalLocName').value.trim();
            const link = document.getElementById('modalLocLink').value.trim();
            const message = document.getElementById('modalLocMessage').value.trim();

            if(!name || !link) { showToast('الاسم والرابط مطلوبان', true); return; }
            if(name.length > 12) { showToast(translations[currentLang].errorNameLength, true); return; }

            if (id) {
                const index = savedLocations.findIndex(l => l.id === id);
                if (index > -1) savedLocations[index] = { id, name, link, message };
            } else {
                savedLocations.push({ id: Date.now().toString(), name, link, message });
            }

            localStorage.setItem('0xh_locations', JSON.stringify(savedLocations));
            renderLocations();
            renderLocationsManager();
            closeLocManageModal();
            showToast(currentLang === 'ar' ? 'تم الحفظ بنجاح' : 'Saved successfully', false);
        }

        function renderLocations() {
            const select = document.getElementById('selectedLocation');
            const currentGps = translations[currentLang].currentGpsOption;
            select.innerHTML = `
                <option value="" class="text-gray-800">${translations[currentLang].noLocationSelected}</option>
                <option value="CURRENT_GPS" class="text-blue-600 font-black">${currentGps}</option>
            `;
            savedLocations.forEach(loc => {
                const opt = document.createElement('option');
                opt.value = loc.id;
                opt.className = "text-gray-900 font-bold";
                opt.textContent = `📍 ${loc.name}`;
                select.appendChild(opt);
            });
        }

        function renderLocationsManager() {
            const listContainer = document.getElementById('locationsListContainer');
            listContainer.innerHTML = '';
            if(savedLocations.length === 0) {
                listContainer.innerHTML = `<div class="text-center text-sm opacity-50 py-2">${currentLang === 'ar' ? 'لا توجد مواقع محفوظة' : 'No saved locations'}</div>`;
                return;
            }
            savedLocations.forEach(loc => {
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-white/5 p-3 rounded-xl border border-white/10";
                div.innerHTML = `
                    <div class="overflow-hidden flex-1 pl-2 rtl:pr-2">
                        <h4 class="font-bold text-sm text-[#25D366] truncate">${loc.name}</h4>
                        <p class="text-xs opacity-70 truncate" dir="ltr">${loc.link}</p>
                    </div>
                    <div class="flex gap-2 shrink-0">
                        <button onclick="openLocManageModal('${loc.id}')" class="bg-blue-500/20 text-blue-300 hover:bg-blue-500 hover:text-white w-8 h-8 rounded-lg transition flex items-center justify-center no-flicker"><i class="fas fa-pen text-xs"></i></button>
                        <button onclick="deleteLocation('${loc.id}')" class="bg-red-500/20 text-red-300 hover:bg-red-500 hover:text-white w-8 h-8 rounded-lg transition flex items-center justify-center no-flicker"><i class="fas fa-trash text-xs"></i></button>
                    </div>
                `;
                listContainer.appendChild(div);
            });
        }

        function deleteLocation(id) {
            savedLocations = savedLocations.filter(loc => loc.id !== id);
            localStorage.setItem('0xh_locations', JSON.stringify(savedLocations));
            renderLocations();
            renderLocationsManager();
        }

        async function handleSend() {
            let phone = document.getElementById('phoneInput').value.replace(/\s+/g, '').replace(/[^0-9+]/g, '');
            let name = document.getElementById('nameHint').value.trim();
            let selectedLocId = document.getElementById('selectedLocation').value;
            
            if (!phone) { showToast(translations[currentLang].errorEmptyPhone, true); return; }
            if (phone.length < 7) { showToast(translations[currentLang].errorShortPhone, true); return; }
            if (phone.length > 15) { showToast(translations[currentLang].errorLongPhone, true); return; }
            if (name.length > 12) { showToast(translations[currentLang].errorNameLength, true); return; }

            if (phone.startsWith('07') && phone.length === 10) phone = '962' + phone.substring(1);
            else if (phone.startsWith('00')) phone = phone.substring(2);
            else if (phone.startsWith('+')) phone = phone.substring(1);

            const btn = document.getElementById('sendBtn');
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');

            let textParam = "";
            let locationNameForHistory = "";
            let messageContentForHistory = "";

            if (selectedLocId === 'CURRENT_GPS') {
                btn.classList.add('opacity-80', 'animate-pulse');
                btnIcon.className = "fas fa-spinner fa-spin text-2xl";
                btnText.innerText = translations[currentLang].loadingGps;

                try {
                    const position = await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(resolve, reject, {timeout: 10000});
                    });
                    const mapLink = `https://maps.google.com/?q=${position.coords.latitude},${position.coords.longitude}`;
                    const msg = currentLang === 'ar' ? `مرحباً، هذا هو موقعي الحالي:\n${mapLink}` : `Hello, this is my current location:\n${mapLink}`;
                    textParam = `?text=${encodeURIComponent(msg)}`;
                    locationNameForHistory = currentLang === 'ar' ? 'موقعي الحالي (GPS)' : 'Current GPS';
                    messageContentForHistory = msg;
                } catch (error) {
                    showToast(translations[currentLang].toastGpsError, true);
                    btn.classList.remove('opacity-80', 'animate-pulse');
                    btnIcon.className = "fab fa-whatsapp text-2xl";
                    btnText.innerText = translations[currentLang].transferBtn;
                    return;
                }
            } else if (selectedLocId) {
                const loc = savedLocations.find(l => l.id === selectedLocId);
                if (loc) {
                    const messageContent = loc.message ? `${loc.message}\n${loc.link}` : loc.link;
                    textParam = `?text=${encodeURIComponent(messageContent)}`;
                    locationNameForHistory = loc.name;
                    messageContentForHistory = messageContent;
                }
            }

            // Save to history
            const existingIndex = history.findIndex(item => item.phone === phone);
            if (existingIndex > -1) {
                history[existingIndex].name = name || history[existingIndex].name;
                history[existingIndex].locationSent = locationNameForHistory || history[existingIndex].locationSent;
                history[existingIndex].messageSent = messageContentForHistory || history[existingIndex].messageSent;
                history[existingIndex].date = new Date().toISOString();
            } else {
                history.unshift({
                    id: Date.now().toString(), phone, name, locationSent: locationNameForHistory, messageSent: messageContentForHistory, notes: "", date: new Date().toISOString()
                });
            }
            if(history.length > 100) history.pop(); 
            localStorage.setItem('0xh_history', JSON.stringify(history));

            btn.classList.remove('animate-pulse');
            btn.classList.add('scale-95', 'opacity-80');
            btnIcon.className = "fab fa-whatsapp text-2xl";
            btnText.innerText = translations[currentLang].readyBtn;
            
            setTimeout(() => {
                btn.classList.remove('scale-95', 'opacity-80');
                btnText.innerText = translations[currentLang].transferBtn;
                window.location.href = `https://wa.me/${phone}${textParam}`;
                
                // Clear inputs automatically for next transaction
                document.getElementById('phoneInput').value = '';
                document.getElementById('nameHint').value = '';
                document.getElementById('selectedLocation').value = '';
            }, 400);
        }

        function renderHistoryDetailed() {
            const list = document.getElementById('detailedHistoryList');
            const filterValue = document.getElementById('historyFilter').value;
            list.innerHTML = '';
            
            let filteredHistory = history;
            const now = new Date();
            if(filterValue === 'TODAY') {
                filteredHistory = history.filter(h => new Date(h.date).toDateString() === now.toDateString());
            } else if (filterValue === 'YESTERDAY') {
                const yesterday = new Date(now); yesterday.setDate(yesterday.getDate() - 1);
                filteredHistory = history.filter(h => new Date(h.date).toDateString() === yesterday.toDateString());
            }

            if (filteredHistory.length === 0) {
                list.innerHTML = `<div class="text-center opacity-50 py-10 border-2 border-dashed border-white/10 rounded-xl">${currentLang === 'ar' ? 'لا يوجد سجل يطابق البحث' : 'No records found'}</div>`;
                return;
            }

            filteredHistory.forEach(item => {
                const card = document.createElement('div');
                card.className = 'glass-panel p-4 rounded-2xl relative bg-white/5 border border-white/10';
                
                const itemDate = new Date(item.date);
                let dateStr = itemDate.toLocaleDateString();
                const timeStr = itemDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                if (itemDate.toDateString() === now.toDateString()) dateStr = translations[currentLang].lblToday;

                let checkboxHTML = selectionMode ? `<input type="checkbox" class="custom-checkbox absolute top-4 ${currentLang === 'ar' ? 'left-4' : 'right-4'} z-10" onchange="toggleSelection('${item.id}', this.checked)" ${selectedIds.has(item.id) ? 'checked' : ''}>` : '';
                let locationTag = item.locationSent ? `<div class="mt-2 text-xs bg-blue-500/20 text-blue-300 px-2 py-1 rounded-md border border-blue-500/30 font-bold inline-block"><i class="fas fa-map-marker-alt"></i> ${translations[currentLang].lblSentLocation} ${item.locationSent}</div>` : '';
                let notesSection = item.notes ? `<div class="mt-2 pt-2 border-t border-white/10"><p class="text-xs text-[#25D366] font-bold"><i class="fas fa-sticky-note"></i> ملاحظات:</p><p class="text-sm opacity-90">${item.notes}</p></div>` : '';

                card.innerHTML = `
                    ${checkboxHTML}
                    <div class="flex justify-between items-start mb-2">
                        <div class="text-xs opacity-50 font-bold">${translations[currentLang].lblAdded} ${dateStr}، ${timeStr}</div>
                        <div class="flex gap-2 ${selectionMode ? 'hidden' : ''}">
                            <button onclick="openEditHistoryModal('${item.id}')" class="bg-blue-500/20 hover:bg-blue-500 text-blue-300 hover:text-white w-7 h-7 rounded transition flex items-center justify-center no-flicker"><i class="fas fa-pen text-xs"></i></button>
                            <button onclick="confirmDelete('${item.id}')" class="bg-red-500/20 hover:bg-red-500 text-red-300 hover:text-white w-7 h-7 rounded transition flex items-center justify-center no-flicker"><i class="fas fa-trash text-xs"></i></button>
                        </div>
                    </div>
                    <div class="font-black text-2xl mb-1" dir="ltr">+${item.phone}</div>
                    ${item.name ? `<div class="font-bold text-md text-[#25D366]">${item.name}</div>` : ''}
                    ${locationTag}
                    ${notesSection}
                    <div class="mt-3">
                        <a href="https://wa.me/${item.phone}" class="block bg-white/10 hover:bg-[#25D366] hover:text-white text-center py-2 rounded-lg font-bold text-sm transition no-flicker"><i class="fab fa-whatsapp"></i> مراسلة سريعة</a>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function toggleSelectionUI() {
            selectionMode = !selectionMode;
            selectedIds.clear();
            document.getElementById('multiDeleteBar').classList.toggle('hidden', !selectionMode);
            renderHistoryDetailed();
            document.getElementById('selectedCountText').innerText = `${selectedIds.size} محدد`;
        }
        function toggleSelection(id, isChecked) {
            isChecked ? selectedIds.add(id) : selectedIds.delete(id);
            document.getElementById('selectedCountText').innerText = `${selectedIds.size} محدد`;
        }

        function openEditHistoryModal(id) {
            const item = history.find(h => h.id === id);
            if (!item) return;
            document.getElementById('editHistId').value = item.id;
            document.getElementById('editHistPhone').value = item.phone;
            document.getElementById('editHistName').value = item.name || '';
            document.getElementById('editHistNotes').value = item.notes || '';
            document.getElementById('editHistoryModal').classList.remove('hidden');
        }
        function closeEditHistoryModal() { document.getElementById('editHistoryModal').classList.add('hidden'); }
        function saveHistoryEdit() {
            const id = document.getElementById('editHistId').value;
            const phone = document.getElementById('editHistPhone').value.trim().replace(/\s+/g, '');
            const name = document.getElementById('editHistName').value.trim();
            const notes = document.getElementById('editHistNotes').value.trim();
            if (!phone) { showToast('الرقم مطلوب', true); return; }
            const index = history.findIndex(h => h.id === id);
            if (index > -1) {
                history[index].phone = phone; history[index].name = name; history[index].notes = notes;
                localStorage.setItem('0xh_history', JSON.stringify(history));
                renderHistoryDetailed();
            }
            closeEditHistoryModal();
            showToast('تم التعديل بنجاح', false);
        }

        function confirmDelete(id) { itemToDelete = id; showDeleteModal(); }
        function confirmDeleteAll() { if (history.length === 0) return; itemToDelete = 'ALL'; showDeleteModal(); }
        function executeMultiDelete() { if (selectedIds.size === 0) return; itemToDelete = 'MULTI'; showDeleteModal(); }
        function showDeleteModal() { document.getElementById('deleteModal').classList.remove('hidden'); }
        function closeDeleteModal() { document.getElementById('deleteModal').classList.add('hidden'); itemToDelete = null; }
        
        document.getElementById('confirmDeleteBtn').onclick = function() {
            if (itemToDelete === 'ALL') history = [];
            else if (itemToDelete === 'MULTI') { history = history.filter(h => !selectedIds.has(h.id)); toggleSelectionUI(); }
            else history = history.filter(h => h.id !== itemToDelete);
            localStorage.setItem('0xh_history', JSON.stringify(history));
            renderHistoryDetailed();
            closeDeleteModal();
            showToast('تم الحذف بنجاح', false);
        };

        window.onload = init;
    </script>
</body>
</html>
