        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { primary: '#10b981' },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'shimmer': 'shimmer 2.5s infinite linear',
                        'spin-slow': 'spin 4s linear infinite',
                    },
                    keyframes: {
                        float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } },

    <style>
        body {
            font-family: 'Cairo', sans-serif;
            margin: 0; padding: 0;
            overflow-x: hidden;
            background-color: #0f172a; /* Dark default */
            color: #f8fafc;
            transition: background-color 0.5s ease;
        }
        html:not(.dark) body {
            background-color: #f0fdf4; /* Light default */
            color: #0f172a;
        }

        /* Glassmorphism Classes */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        html:not(.dark) .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
        }

        .celestial-container {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none; z-index: 0; overflow: hidden;
        }
        .celestial-body {
            position: absolute; left: 50%;
            border-radius: 50%;
        }

        /* الشمس (Sun) */
        .sun-state {
            width: 120px; height: 120px;
            background: radial-gradient(circle, #fcd34d 0%, #f59e0b 100%);
            box-shadow: 0 0 60px #f59e0b, 0 0 100px #fcd34d inset;
            opacity: 0; transform: translate(-50%, 100vh);
        }
        .sun-ray {
            position: absolute; top: 50%; left: 50%;
            width: 160px; height: 160px;
            background: radial-gradient(circle, rgba(253,230,138,0.4) 0%, transparent 60%);
            transform: translate(-50%, -50%);
            border-radius: 50%;
            animation: pulse-ray 3s infinite alternate;
        }

        /* القمر (Moon) */
        .moon-state {
            width: 100px; height: 100px;
            background: radial-gradient(circle, #e2e8f0 0%, #94a3b8 100%);
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.3), inset -15px -15px 25px rgba(0,0,0,0.3);
            opacity: 1; transform: translate(-50%, 15vh);
        }
        .crater { position: absolute; background: rgba(0,0,0,0.15); border-radius: 50%; box-shadow: inset 2px 2px 5px rgba(0,0,0,0.2); }
        .crater-1 { width: 25px; height: 25px; top: 20%; left: 25%; }
        .crater-2 { width: 15px; height: 15px; top: 50%; left: 60%; }
        .crater-3 { width: 35px; height: 35px; top: 60%; left: 20%; }
        .crater-4 { width: 10px; height: 10px; top: 30%; left: 75%; }

        @keyframes pulse-ray { 0% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; } 100% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; } }

        /* حركات النزول والهبوط كما طلبت تماماً */
        @keyframes slideDownOut {
            0% { transform: translate(-50%, 15vh) scale(1); opacity: 1; }
            100% { transform: translate(-50%, 100vh) scale(0.5); opacity: 0; }
        }
        @keyframes slideDownIn {
            0% { transform: translate(-50%, -50vh) scale(0.5); opacity: 0; }
            100% { transform: translate(-50%, 15vh) scale(1); opacity: 1; }
        }

        #bgCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

        .watermark {
            z-index: 50; padding: 10px 20px; border-radius: 9999px;
            font-size: 0.9rem; font-weight: 600; text-decoration: none;
            background: linear-gradient(90deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0.1) 100%);
            background-size: 200% auto; border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(10px); display: inline-flex; align-items: center; gap: 8px;
            transition: all 0.3s;
            margin-top: auto; margin-bottom: 24px;
        }
        html:not(.dark) .watermark {
            background: linear-gradient(90deg, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.05) 100%);
            border: 1px solid rgba(0,0,0,0.1); color: #333;
        }
        .watermark:hover { transform: scale(1.05); }
        .shimmer-text {
            background-clip: text; -webkit-background-clip: text;
            background-image: linear-gradient(90deg, #10b981 0%, #34d399 50%, #10b981 100%);
            background-size: 200% auto; animation: shimmer 2.5s infinite linear; color: transparent;
        }

        /* Custom Scrollbar for history */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(16, 185, 129, 0.5); border-radius: 10px; }
    </style>
</head>

        // Modals
        const confirmModal = document.getElementById('confirmModal');
        const confirmModalContent = document.getElementById('confirmModalContent');
        const editModal = document.getElementById('editModal');
        const editModalContent = document.getElementById('editModalContent');
        
        // Views
        const mainView = document.getElementById('mainView');
        const helpView = document.getElementById('helpView');

        // --- Core Functions ---
        function applyTheme() {
            const sun = document.getElementById('sun');
            const moon = document.getElementById('moon');

            if (isDark) { 
                document.documentElement.classList.add('dark');
                sunIcon.classList.remove('hidden'); moonIcon.classList.add('hidden');
                
                if (isInitialLoad) {
                    sun.style.cssText = 'transform: translate(-50%, 100vh); opacity: 0; animation: none;';
                    moon.style.cssText = 'transform: translate(-50%, 15vh); opacity: 1; animation: none;';
                } else {
                    sun.style.animation = 'slideDownOut 1s forwards cubic-bezier(0.4, 0, 0.2, 1)';
                    moon.style.animation = 'slideDownIn 1s forwards cubic-bezier(0.4, 0, 0.2, 1)';
                }
            } else { 
                document.documentElement.classList.remove('dark');
                moonIcon.classList.remove('hidden'); sunIcon.classList.add('hidden');
                
                if (isInitialLoad) {
                    sun.style.cssText = 'transform: translate(-50%, 15vh); opacity: 1; animation: none;';
                    moon.style.cssText = 'transform: translate(-50%, 100vh); opacity: 0; animation: none;';
                } else {
                    moon.style.animation = 'slideDownOut 1s forwards cubic-bezier(0.4, 0, 0.2, 1)';
                    sun.style.animation = 'slideDownIn 1s forwards cubic-bezier(0.4, 0, 0.2, 1)';
                }
            }
            updateCanvasColors();
        }

        function applyLanguage() {
            const t = translations[currentLang];
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            langToggle.textContent = currentLang === 'ar' ? 'EN' : 'عربي';
            
            document.getElementById('appTitle').textContent = t.appTitle;
            document.getElementById('appDesc').textContent = t.appDesc;
            phoneInput.placeholder = t.phonePlaceholder;
            hintInput.placeholder = t.hintPlaceholder;
            btnText.textContent = t.convertBtn;
            document.getElementById('historyTitle').textContent = t.historyTitle;
            document.getElementById('clearHistoryBtn').textContent = t.clearHistory;
            document.getElementById('watermarkText').textContent = t.watermark;
            
            document.getElementById('multiSelectBtn').textContent = t.multiSelect;
            document.getElementById('cancelSelectBtn').textContent = t.cancelSelect;
            document.getElementById('deleteSelectedBtn').textContent = t.deleteSelected;
            
            document.getElementById('confirmTitle').textContent = t.confirmDelTitle;
            document.getElementById('confirmYes').textContent = t.yes;
            document.getElementById('confirmNo').textContent = t.no;
            
            document.getElementById('editTitle').textContent = t.editTitle;
            document.getElementById('editPhoneLabel').textContent = t.editPhone;
            document.getElementById('editHintLabel').textContent = t.editHint;
            document.getElementById('saveEditBtn').textContent = t.save;
            document.getElementById('cancelEditBtn').textContent = t.no;

            document.getElementById('helpBtnText').textContent = t.helpBtn;
            document.getElementById('helpBack').textContent = t.helpBack;
            document.getElementById('helpBackBottomText').textContent = t.helpBack;
            document.getElementById('helpTitle').textContent = t.helpPageTitle;
            document.getElementById('helpContent').innerHTML = t.helpContent;
            
            renderHistory();
        }

        function loadPreferences() {
            const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            isDark = sysDark;
            const sysLang = navigator.language.startsWith('ar') ? 'ar' : 'en';
            currentLang = sysLang;
            
            const savedHistory = localStorage.getItem('0xh_history');
            if(savedHistory) history = JSON.parse(savedHistory);
            
            applyTheme();
            applyLanguage();
            handleRouting();
            
            // Allow animations after initial load
            setTimeout(() => { isInitialLoad = false; }, 100);
        }

        // --- WhatsApp Logic ---
        function formatNumberForWhatsApp(num) {
            let cleaned = num.replace(/\D/g, '');
            // الخوارزمية الذكية للأردن
            if (cleaned.startsWith('00')) cleaned = cleaned.substring(2);
            else if (cleaned.startsWith('07')) cleaned = '962' + cleaned.substring(1);
            else if (cleaned.startsWith('0')) cleaned = cleaned.substring(1); 
            return cleaned;
        }

        convertBtn.addEventListener('click', () => {
            const rawNum = phoneInput.value.trim();
            if(!rawNum) return;
            
            const finalNum = formatNumberForWhatsApp(rawNum);
            const hint = hintInput.value.trim();
            
            // إضافة للسجل
            const newItem = { id: Date.now().toString(), num: finalNum, display: rawNum, hint: hint };
            history.unshift(newItem);
            localStorage.setItem('0xh_history', JSON.stringify(history));
            renderHistory();

            // تأثير الزر
            const originalText = btnText.textContent;
            btnText.textContent = translations[currentLang].readyBtn;
            convertBtn.classList.add('scale-105', 'bg-emerald-400');
            
            setTimeout(() => {
                btnText.textContent = originalText;
                convertBtn.classList.remove('scale-105', 'bg-emerald-400');
                phoneInput.value = ''; hintInput.value = '';
                window.location.href = `https://wa.me/${finalNum}`;
            }, 1500);
        });

        // --- History Logic ---
        function toggleSelectionUI(activate) {
            isSelectionMode = activate;
            selectedIds.clear();
            const multiBtn = document.getElementById('multiSelectBtn');
            const cancelBtn = document.getElementById('cancelSelectBtn');
            const delSelBtn = document.getElementById('deleteSelectedBtn');
            const clearBtn = document.getElementById('clearHistoryBtn');

            if(isSelectionMode) {
                multiBtn.classList.add('hidden');
                cancelBtn.classList.remove('hidden');
                delSelBtn.classList.remove('hidden');
                clearBtn.classList.add('hidden');
            } else {
                if(history.length > 0) multiBtn.classList.remove('hidden');
                else multiBtn.classList.add('hidden');
                cancelBtn.classList.add('hidden');
                delSelBtn.classList.add('hidden');
                if(history.length > 0) clearBtn.classList.remove('hidden');
            }
            // استدعاء إعادة الرسم هنا فقط لأنها استجابة لزر التحديد/الإلغاء
            renderHistory();
        }

        function renderHistory() {
            historyList.innerHTML = '';
            
            if (history.length === 0) {
                historyList.innerHTML = `<p class="text-center text-sm opacity-50 py-4">${translations[currentLang].emptyHistory}</p>`;
                document.getElementById('clearHistoryBtn').classList.add('hidden');
                document.getElementById('multiSelectBtn').classList.add('hidden');
                return;
            }
            
            if(!isSelectionMode) {
                document.getElementById('clearHistoryBtn').classList.remove('hidden');
                document.getElementById('multiSelectBtn').classList.remove('hidden');
            }

            history.forEach(item => {
                const div = document.createElement('div');
                div.className = `flex justify-between items-center p-3 rounded-xl bg-black/10 dark:bg-black/20 border border-white/5 transition-colors ${selectedIds.has(item.id) ? 'bg-primary/20 border-primary/50' : ''}`;
                
                let selectUI = '';
                if(isSelectionMode) {
                    selectUI = `
                        <div class="mr-3 ml-3 cursor-pointer select-checkbox" data-id="${item.id}">
                            <div class="w-5 h-5 rounded border ${selectedIds.has(item.id) ? 'bg-primary border-primary flex items-center justify-center' : 'border-gray-400'}">
                                ${selectedIds.has(item.id) ? '<svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>' : ''}
                            </div>
                        </div>`;
                }

                div.innerHTML = `
                    <div class="flex items-center flex-1 overflow-hidden">
                        ${selectUI}
                        <div class="flex-1 cursor-pointer flex flex-col items-start truncate" onclick="${isSelectionMode ? `toggleCheckbox('${item.id}')` : `window.location.href='https://wa.me/${item.num}'`}">
                            <span class="font-bold font-mono tracking-wider">${item.num}</span>
                            ${item.hint ? `<span class="text-xs text-primary truncate max-w-full">${item.hint}</span>` : ''}
                        </div>
                    </div>
                    <div class="flex gap-2 opacity-70 ${isSelectionMode ? 'hidden' : ''}">
                        <button onclick="openEditModal('${item.id}')" class="p-2 hover:text-blue-400 transition-colors"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg></button>
                        <button onclick="confirmDelete('${item.id}')" class="p-2 hover:text-red-400 transition-colors"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                    </div>
                `;
                historyList.appendChild(div);
            });

            if(isSelectionMode) {
                document.querySelectorAll('.select-checkbox').forEach(el => {
                    el.addEventListener('click', (e) => { e.stopPropagation(); toggleCheckbox(el.dataset.id); });
                });
            }
        }

        window.toggleCheckbox = function(id) {
            if(selectedIds.has(id)) selectedIds.delete(id);
            else selectedIds.add(id);
            renderHistory();
        }

        // --- Modals Logic ---
        function showModal(modal, content) {
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); content.classList.remove('scale-95'); }, 10);
        }
        function hideModal(modal, content) {
            modal.classList.add('opacity-0'); content.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        // Delete Confirm Modal
        window.confirmDelete = function(id) {
            document.getElementById('confirmMsg').textContent = translations[currentLang].confirmDelMsg;
            confirmActionCallback = () => {
                history = history.filter(item => item.id !== id);
                updateHistoryState();
            };
            showModal(confirmModal, confirmModalContent);
        }

        document.getElementById('clearHistoryBtn').addEventListener('click', () => {
            document.getElementById('confirmMsg').textContent = translations[currentLang].confirmClearMsg;
            confirmActionCallback = () => { history = []; updateHistoryState(); };
            showModal(confirmModal, confirmModalContent);
        });

        document.getElementById('deleteSelectedBtn').addEventListener('click', () => {
            if(selectedIds.size === 0) return;
            document.getElementById('confirmMsg').textContent = translations[currentLang].confirmMultiMsg;
            confirmActionCallback = () => {
                history = history.filter(item => !selectedIds.has(item.id));
                toggleSelectionUI(false);
                updateHistoryState();
            };
            showModal(confirmModal, confirmModalContent);
        });

        document.getElementById('confirmYes').addEventListener('click', () => {
            if(confirmActionCallback) confirmActionCallback();
            hideModal(confirmModal, confirmModalContent);
        });
        document.getElementById('confirmNo').addEventListener('click', () => hideModal(confirmModal, confirmModalContent));

        // Edit Modal
        window.openEditModal = function(id) {
            const item = history.find(i => i.id === id);
            if(!item) return;
            currentEditId = id;
            document.getElementById('editPhoneInput').value = item.num;
            document.getElementById('editHintInput').value = item.hint || '';
            showModal(editModal, editModalContent);
        }

        document.getElementById('saveEditBtn').addEventListener('click', () => {
            if(currentEditId) {
                const item = history.find(i => i.id === currentEditId);
                if(item) {
                    item.num = document.getElementById('editPhoneInput').value.trim();
                    item.hint = document.getElementById('editHintInput').value.trim();
                    updateHistoryState();
                }
            }
            hideModal(editModal, editModalContent);
        });
        document.getElementById('cancelEditBtn').addEventListener('click', () => hideModal(editModal, editModalContent));

        function updateHistoryState() {
            localStorage.setItem('0xh_history', JSON.stringify(history));
            renderHistory();
        }

        // Event Listeners for UI
        document.getElementById('multiSelectBtn').addEventListener('click', () => toggleSelectionUI(true));
        document.getElementById('cancelSelectBtn').addEventListener('click', () => toggleSelectionUI(false));
        
        themeToggle.addEventListener('click', () => { isDark = !isDark; applyTheme(); });
        langToggle.addEventListener('click', () => { currentLang = currentLang === 'ar' ? 'en' : 'ar'; applyLanguage(); });

        // --- Routing (Help Page) ---
        function handleRouting() {
            if (window.location.hash === '#help') {
                mainView.classList.add('hidden');
                helpView.classList.remove('hidden');
            } else {
                helpView.classList.add('hidden');
                mainView.classList.remove('hidden');
            }
        }
        window.addEventListener('hashchange', handleRouting);
        document.getElementById('openHelpBtn').addEventListener('click', () => { window.location.hash = 'help'; });
        document.getElementById('closeHelpBtn').addEventListener('click', () => { window.location.hash = ''; });
        document.getElementById('closeHelpBtnBottom').addEventListener('click', () => { window.location.hash = ''; });

        // --- Canvas Animation ---
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function initCanvas() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            particles = [];
            const count = window.innerWidth < 768 ? 20 : 50;
            for(let i=0; i<count; i++) {
                particles.push({
                    x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                    radius: Math.random() * 2 + 1,
                    vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5,
                    baseX: Math.random() * canvas.width, angle: Math.random() * Math.PI * 2
                });
            }
        }

        function updateCanvasColors() {
            ctx.fillStyle = isDark ? 'rgba(16, 185, 129, 0.3)' : 'rgba(16, 185, 129, 0.15)';
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            updateCanvasColors();
            particles.forEach(p => {
                p.angle += 0.01;
                p.x = p.baseX + Math.sin(p.angle) * 20; // حركة متعرجة انسيابية
                p.y += p.vy - 0.2; // صعود بطيء
                
                if (p.y < -10) { p.y = canvas.height + 10; p.baseX = Math.random() * canvas.width; }
                
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(animateCanvas);
        }

        window.addEventListener('resize', initCanvas);
        
        // Start app
        initCanvas();
        animateCanvas();
        loadPreferences();
    </script>
</body>
</html>
