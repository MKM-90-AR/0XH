<!DOCTYPE html>

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="0xh">

    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="0XH.jpg">
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%220xh%20WhatsApp%20Direct%22%2C%22short_name%22%3A%220xh%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230f172a%22%2C%22theme_color%22%3A%22%2325D366%22%2C%22icons%22%3A%5B%7B%22src%22%3A%220XH.jpg%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fjpeg%22%7D%5D%7D">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Cairo', sans-serif;
            transition: background-color 0.5s ease, color 0.5s ease;
            min-height: 100vh;
            min-height: 100dvh; /* لدعم شاشات الهواتف الحديثة بدقة */
            position: relative;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .dark-mode {
            background-color: #0f172a;
            color: #f8fafc;
        }

        .light-mode {
            background-color: #f0f9ff;
            color: #0f172a;
        }
        
        .light-mode .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
            color: #1e293b;
        }

        /* إصلاح ألوان النصوص والقوائم في الوضع الفاتح */
        .light-mode input, .light-mode select, .light-mode textarea {
            color: #111827 !important; 
            background-color: rgba(255,255,255,0.7) !important;
            border-color: rgba(0,0,0,0.1) !important;
        }
        .light-mode input::placeholder, .light-mode textarea::placeholder {
            color: #6b7280 !important;
        }

        /* منع الوميض الرمادي في الأزرار */
        .no-flicker {
            transform: translateZ(0);
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }

        #topNavbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        .header-logo {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #25D366;
            box-shadow: 0 0 10px rgba(37, 211, 102, 0.5);
            transition: transform 0.5s ease;
        }
        .header-logo:hover {
            transform: rotate(360deg);
        }

        #particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        
        .particle { 
            position: absolute; 
            border-radius: 50%; 
            animation: float-up linear infinite; 
        }
        
        .dark-mode .particle { background-color: rgba(37, 211, 102, 0.3); }
        .light-mode .particle { background-color: rgba(14, 165, 233, 0.2); }

        @keyframes float-up {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-120vh) translateX(30px); opacity: 0; }
        }

        .celestial-body {
            position: absolute; display: flex; justify-content: center; align-items: center;
            width: 100%; height: 100%; top: 0; left: 0;
        }
        .moon {
            width: 22px; height: 22px; background: #e2e8f0; border-radius: 50%;
            box-shadow: 0 0 10px rgba(255,255,255,0.5) inset; position: relative; overflow: hidden;
        }
        .moon::before {
            content: ''; position: absolute; width: 6px; height: 6px; background: rgba(0,0,0,0.15);
            border-radius: 50%; top: 3px; left: 3px;
            box-shadow: 7px 5px 0 -1px rgba(0,0,0,0.15);
        }
        .sun {
            width: 22px; height: 22px; background: #FDB813; border-radius: 50%;
            box-shadow: 0 0 12px #FDB813;
        }

        @keyframes slideDownOut {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(30px); opacity: 0; }
        }
        @keyframes slideDownIn {
            0% { transform: translateY(-30px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        .animate-out { animation: slideDownOut 0.3s forwards; }
        .animate-in { animation: slideDownIn 0.3s forwards; }
        .hide { display: none !important; }

        #toast-container {
            position: fixed;
            top: 75px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
            width: 90%;
            max-width: 400px;
        }
        .toast {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border-bottom: 3px solid #ef4444; 
            opacity: 0;
            transform: translateY(-20px);
            animation: toastEnter 0.3s forwards;
            direction: rtl; 
        }
        .toast.success { border-bottom-color: #25D366; }
        @keyframes toastEnter { to { opacity: 1; transform: translateY(0); } }
        @keyframes toastExit { to { opacity: 0; transform: translateY(-20px); } }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: #25D366; border-radius: 10px; }
        
        .modal { background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); }
        .custom-checkbox { accent-color: #25D366; width: 1.2rem; height: 1.2rem; }
    </style>
</head>
<body class="dark-mode transition-colors duration-300" id="body">

    <div class="container mx-auto px-4 pt-24 pb-6 flex flex-col items-center min-h-[100dvh] relative z-10" id="mainView">
        
        <!-- App Box -->
        <div class="glass-panel p-8 rounded-3xl w-full max-w-md text-center mt-2">
            <div class="space-y-4">
                <input type="tel" id="phoneInput" class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-center text-xl focus:outline-none focus:ring-2 focus:ring-[#25D366] transition placeholder-gray-400 font-bold" placeholder="أدخل الرقم (مثال: 079...)" autocomplete="off" dir="ltr">
                
                <div>
                    <input type="text" id="nameHint" maxlength="12" class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-center focus:outline-none focus:ring-2 focus:ring-[#25D366] transition placeholder-gray-400 font-bold" placeholder="اسم الشخص أو تلميح (اختياري)" autocomplete="off">
                </div>

                    <select id="selectedLocation" class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-center focus:outline-none focus:ring-2 focus:ring-[#25D366] transition appearance-none font-bold" style="text-align-last: center;">

                        <option value="CURRENT_GPS" class="text-blue-600 font-black" data-i18n="currentGpsOption">📍 إرفاق موقعي الحالي (GPS)</option>

                <button id="sendBtn" onclick="handleSend()" class="w-full bg-gradient-to-r from-[#25D366] to-[#128C7E] text-white font-bold py-4 rounded-xl shadow-lg hover:shadow-xl hover:scale-[1.02] transition-all flex justify-center items-center gap-2">
                    <i id="btnIcon" class="fab fa-whatsapp text-2xl"></i>
                    <span id="btnText" class="text-lg" data-i18n="transferBtn">تحويل ومراسلة</span>
                </button>
            </div>
        </div>

        <!-- Navigation Buttons -->
        <div class="w-full max-w-md space-y-3 mt-4">
            <button onclick="openHistoryView()" class="w-full p-4 rounded-xl flex items-center justify-between bg-white/5 hover:bg-white/10 border border-blue-500/30 transition-colors duration-300 cursor-pointer group no-flicker">

                    <i class="fas fa-history text-xl text-blue-400 group-hover:rotate-180 transition duration-500"></i>
                    <span class="font-bold text-lg" data-i18n="openHistoryBtn">سجل الأرقام السابقة</span>

            <button onclick="openHelp()" class="w-full p-4 rounded-xl flex items-center justify-between bg-white/5 hover:bg-white/10 border border-purple-500/30 transition-colors duration-300 cursor-pointer group no-flicker">

                    <span class="font-bold text-lg" data-i18n="howToUseBtn">كيف أستخدم الموقع؟</span>

                <i class="fas fa-chevron-left rtl:rotate-180 opacity-60"></i>
            </button>
        </div>

        <!-- Watermark (mt-auto pushes it to bottom without forcing scroll) -->

            <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/40 to-transparent -translate-x-full group-hover:animate-[shimmer_1.5s_infinite] skew-x-12"></div>

            </div>
            
            <button onclick="openLocManageModal()" class="w-full bg-blue-500/80 hover:bg-blue-600 text-white font-bold py-3 rounded-xl transition text-sm flex justify-center items-center gap-2 shadow-lg mb-4">
                <i class="fas fa-plus"></i> <span data-i18n="addLocationBtn">إضافة موقع جديد</span>
            </button>

            <div id="locationsListContainer" class="space-y-3 max-h-[50vh] overflow-y-auto pr-1"></div>
        </div>

        <button onclick="closeViews()" class="mt-auto w-full max-w-md bg-gradient-to-r from-[#25D366] to-[#128C7E] text-white font-bold py-4 rounded-xl shadow-lg hover:shadow-xl transition-all flex items-center justify-center gap-2">
            <i class="fas fa-home"></i>
            <span data-i18n="returnBottom">العودة للصفحة الرئيسية</span>
        </button>
    </div>

    <div id="historyView" class="hidden container mx-auto px-4 pt-24 pb-6 flex flex-col items-center min-h-[100dvh] relative z-10">
        <button onclick="closeViews()" class="w-full max-w-md glass-panel hover:bg-white/10 font-bold py-3 px-4 rounded-xl shadow transition flex items-center justify-center gap-2 mb-4">

        </button>

    <div id="deleteModal" class="fixed inset-0 modal hidden flex justify-center items-center z-50 px-4">

        function init() {
            createParticlesInstant();
            renderLocations();
            applyLanguage();
            setupClipboardIntelligence();
            
            window.addEventListener('hashchange', handleRouting);
            window.addEventListener('resize', updateViewMode);
            window.addEventListener('scroll', handleNavbarScroll);
            
            handleRouting();
        }

        function updateViewMode() {
            // كشف التطبيق PWA أو الكمبيوتر
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
            const isMobile = window.innerWidth < 768; 
            const isMainView = (window.location.hash === '' || window.location.hash === '#');

            // إذا كنا في الصفحة الرئيسية، وكان الجهاز (كمبيوتر) أو (تطبيق هاتف) -> نمنع السكرول
            if (isMainView && (isStandalone || !isMobile)) {
                document.body.style.overflow = 'hidden';
            } else {
                // إذا كنا في متصفح هاتف عادي، أو دخلنا لصفحة السجل/المواقع -> نسمح بالسكرول
                document.body.style.overflow = '';
            }
        }

        function handleNavbarScroll() {
            const topNavbar = document.getElementById('topNavbar');
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
            const isMobile = window.innerWidth < 768;
            const isMobileBrowser = isMobile && !isStandalone;
            const isMainView = (window.location.hash === '' || window.location.hash === '#');

            // يعمل الأنيميشن فقط إذا كان متصفح هاتف عادي وفي الصفحة الرئيسية
            if (isMobileBrowser && isMainView) {
                const currentScrollY = window.scrollY;
                if (currentScrollY > lastScrollY && currentScrollY > 50) {
                    topNavbar.style.transform = 'translateY(-100%)';
                } else {
                    topNavbar.style.transform = 'translateY(0)';
                }
                lastScrollY = currentScrollY;
            } else {
                topNavbar.style.transform = 'translateY(0)';
            }
        }

        function createParticlesInstant() {
            const container = document.getElementById('particles');
            if (!container) return;
            container.innerHTML = '';
            for(let i=0; i<20; i++) {
                let div = document.createElement('div');
                div.className = 'particle';
                let size = Math.random() * 8 + 4;
                div.style.width = size + 'px';
                div.style.height = size + 'px';
                div.style.left = Math.random() * 100 + 'vw';
                div.style.bottom = '-20px';
                div.style.animationDuration = (Math.random() * 8 + 4) + 's';
                div.style.animationDelay = '-' + (Math.random() * 10) + 's';
                container.appendChild(div);
            }
        }

        function showToast(message, isError = true) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${isError ? '' : 'success'}`;
            const icon = isError ? '<i class="fas fa-exclamation-circle text-red-400 ml-2 rtl:mr-2"></i>' 
                                 : '<i class="fas fa-check-circle text-green-400 ml-2 rtl:mr-2"></i>';
            toast.innerHTML = `<div class="flex items-center">${icon} ${message}</div>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'toastExit 0.3s forwards';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function setupClipboardIntelligence() {
            const phoneInput = document.getElementById('phoneInput');
            const nameHint = document.getElementById('nameHint');
            
            phoneInput.addEventListener('input', function() {
                this.value = this.value.replace(/\s+/g, '');
            });

            phoneInput.addEventListener('focus', async function() {
                if(this.value === '') {
                    try {
                        const text = await navigator.clipboard.readText();
                        if(text) {
                            const cleaned = text.replace(/[\s-]/g, '');
                            if (/^\+?[0-9]{7,15}$/.test(cleaned)) {
                                this.value = cleaned;
                                showToast(currentLang === 'ar' ? 'تم لصق الرقم من الحافظة' : 'Number pasted', false);
                            }
                        }
                    } catch (err) { }
                }
            });

            nameHint.addEventListener('input', function() {
                if(this.value.length > 12) {
                    this.value = this.value.substring(0, 12);
                    showToast(translations[currentLang].errorNameLength, true);
                }
            });
        }

        function handleRouting() {
            const main = document.getElementById('mainView');
            const help = document.getElementById('helpView');
            const hist = document.getElementById('historyView');
            const locs = document.getElementById('locationsView');
            
            main.classList.add('hidden');
            help.classList.add('hidden');
            hist.classList.add('hidden');
            locs.classList.add('hidden');

            if(window.location.hash === '#help') help.classList.remove('hidden');
            else if(window.location.hash === '#history') { hist.classList.remove('hidden'); renderHistoryDetailed(); }
            else if(window.location.hash === '#locations') { locs.classList.remove('hidden'); renderLocationsManager(); }
            else main.classList.remove('hidden');
            
            window.scrollTo(0,0);
            updateViewMode(); // تحديث حالة السكرول عند كل انتقال
            
            // Ensure Navbar is visible when changing pages
            document.getElementById('topNavbar').style.transform = 'translateY(0)';
        }
        
        function openHelp() { window.location.hash = 'help'; }
        function openHistoryView() { window.location.hash = 'history'; }
        function openLocationsView() { window.location.hash = 'locations'; }
        function closeViews() { window.location.hash = ''; selectionMode = false; }

        document.getElementById('themeToggle').addEventListener('click', () => {
            isDarkMode = !isDarkMode;
            const body = document.getElementById('body');
            const sun = document.getElementById('sunIcon');
            const moon = document.getElementById('moonIcon');

            if (isDarkMode) {
                body.classList.replace('light-mode', 'dark-mode');
                sun.classList.remove('animate-in'); sun.classList.add('animate-out');
                setTimeout(() => { sun.classList.add('hide'); moon.classList.remove('hide', 'animate-out'); moon.classList.add('animate-in'); }, 300);
            } else {
                body.classList.replace('dark-mode', 'light-mode');
                moon.classList.remove('animate-in'); moon.classList.add('animate-out');
                setTimeout(() => { moon.classList.add('hide'); sun.classList.remove('hide', 'animate-out'); sun.classList.add('animate-in'); }, 300);
            }
        });

        document.getElementById('langToggle').addEventListener('click', () => {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.getElementById('langToggle').innerText = currentLang === 'ar' ? 'EN' : 'عربي';
            applyLanguage();
        });

        function applyLanguage() {
            document.getElementById('html-root').setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
            document.getElementById('html-root').setAttribute('lang', currentLang);
            document.getElementById('phoneInput').placeholder = translations[currentLang].phonePlaceholder;
            document.getElementById('nameHint').placeholder = translations[currentLang].namePlaceholder;
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if(translations[currentLang][key]) {
                    if(el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') el.placeholder = translations[currentLang][key];
                    else el.innerText = translations[currentLang][key];
                }
            });

            const arHelp = `
                <div><h3 class="font-bold text-lg text-blue-400 mb-1"><i class="fas fa-bolt"></i> اللصق والتحويل الذكي:</h3><p>بمجرد نسخ رقم سيتم لصقه بدون مسافات. الأرقام المحلية (079) تتحول تلقائياً لمفتاح 962.</p></div>
                <div><h3 class="font-bold text-lg text-green-400 mb-1"><i class="fas fa-map-marker-alt"></i> إرفاق الموقع (GPS):</h3><p>إدارة مواقعك عبر "إدارة المواقع"، أو اختر إرسال موقعك الحالي.</p></div>
                <div><h3 class="font-bold text-lg text-mobile mb-1 text-purple-400"><i class="fas fa-mobile-alt"></i> تطبيق PWA:</h3><p>أضف الموقع للشاشة الرئيسية من المتصفح ليعمل كتطبيق متكامل بدون سكرول مزعج!</p></div>
                <div><h3 class="font-bold text-lg text-red-400 mb-1"><i class="fas fa-exclamation-triangle"></i> تحذير الحفظ (LocalStorage):</h3><p>السجل محلي. مسح بيانات المتصفح سيحذف كل شيء نهائياً!</p></div>
            `;
            const enHelp = `
                <div><h3 class="font-bold text-lg text-blue-400 mb-1"><i class="fas fa-bolt"></i> Smart Routing:</h3><p>Removes spaces. Local formats convert to +962 automatically.</p></div>
                <div><h3 class="font-bold text-lg text-green-400 mb-1"><i class="fas fa-map-marker-alt"></i> Attach Location:</h3><p>Manage maps or send current GPS.</p></div>
                <div><h3 class="font-bold text-lg text-purple-400 mb-1"><i class="fas fa-mobile-alt"></i> PWA App:</h3><p>Add to homescreen for a native app experience without scrolling!</p></div>
                <div><h3 class="font-bold text-lg text-red-400 mb-1"><i class="fas fa-exclamation-triangle"></i> Warning:</h3><p>Data is stored locally. Clearing cache will delete your history!</p></div>
            `;
            document.getElementById('helpContent').innerHTML = currentLang === 'ar' ? arHelp : enHelp;
            renderLocations();
        }

        async function handleSend() {
            let phoneInput = document.getElementById('phoneInput');
            let nameInput = document.getElementById('nameHint');
            let locationSelect = document.getElementById('selectedLocation');
            
            let phone = phoneInput.value.replace(/\s+/g, '').replace(/[^0-9+]/g, '');
            let name = nameInput.value.trim();
            let selectedLocId = locationSelect.value;
            
            if (!phone) { showToast(translations[currentLang].errorEmptyPhone, true); return; }
            if (phone.length < 7) { showToast(translations[currentLang].errorShortPhone, true); return; }
            if (phone.length > 15) { showToast(translations[currentLang].errorLongPhone, true); return; }

            if (phone.startsWith('07') && phone.length === 10) phone = '962' + phone.substring(1);
            else if (phone.startsWith('00')) phone = phone.substring(2);
            else if (phone.startsWith('+')) phone = phone.substring(1);

            const btn = document.getElementById('sendBtn');
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');

            let textParam = "";
            let locationNameForHistory = "";
            let messageContentForHistory = "";

            if (selectedLocId === 'CURRENT_GPS') {
                btn.classList.add('opacity-80', 'animate-pulse');
                btnIcon.className = "fas fa-spinner fa-spin text-2xl";
                btnText.innerText = translations[currentLang].loadingGps;

                try {
                    const position = await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(resolve, reject, {timeout: 10000});
                    });
                    const mapLink = `https://maps.google.com/?q=${position.coords.latitude},${position.coords.longitude}`;
                    const msg = currentLang === 'ar' ? `مرحباً، هذا هو موقعي الحالي:\n${mapLink}` : `Hello, this is my location:\n${mapLink}`;
                    textParam = `?text=${encodeURIComponent(msg)}`;
                    locationNameForHistory = currentLang === 'ar' ? 'موقعي الحالي (GPS)' : 'Current GPS';
                    messageContentForHistory = msg;
                } catch (error) {
                    showToast(translations[currentLang].toastGpsError, true);
                    btn.classList.remove('opacity-80', 'animate-pulse');
                    btnIcon.className = "fab fa-whatsapp text-2xl";
                    btnText.innerText = translations[currentLang].transferBtn;
                    return;
                }
            } else if (selectedLocId) {
                const loc = savedLocations.find(l => l.id === selectedLocId);
                if (loc) {
                    const messageContent = loc.message ? `${loc.message}\n${loc.link}` : loc.link;
                    textParam = `?text=${encodeURIComponent(messageContent)}`;
                    locationNameForHistory = loc.name;
                    messageContentForHistory = messageContent;
                }
            }

            // Save to history
            const existingIndex = history.findIndex(item => item.phone === phone);
            if (existingIndex > -1) {
                history[existingIndex].name = name || history[existingIndex].name;
                history[existingIndex].locationSent = locationNameForHistory || history[existingIndex].locationSent;
                history[existingIndex].messageSent = messageContentForHistory || history[existingIndex].messageSent;
                history[existingIndex].date = new Date().toISOString();
            } else {
                history.unshift({ id: Date.now().toString(), phone, name, locationSent: locationNameForHistory, messageSent: messageContentForHistory, notes: "", date: new Date().toISOString() });
            }
            if(history.length > 100) history.pop(); 
            localStorage.setItem('0xh_history', JSON.stringify(history));

            btn.classList.remove('animate-pulse');
            btn.classList.add('scale-95', 'opacity-80');
            btnIcon.className = "fab fa-whatsapp text-2xl";
            btnText.innerText = translations[currentLang].readyBtn;
            
            setTimeout(() => {
                btn.classList.remove('scale-95', 'opacity-80');
                btnText.innerText = translations[currentLang].transferBtn;
                window.location.href = `https://wa.me/${phone}${textParam}`;
                
                // Clear fields automatically
                phoneInput.value = '';
                nameInput.value = '';
                locationSelect.value = '';
            }, 400);
        }

        function openEditHistoryModal(id) {
            const item = history.find(h => h.id === id);
            if (!item) return;
            document.getElementById('editHistId').value = item.id;
            document.getElementById('editHistPhone').value = item.phone;
            document.getElementById('editHistName').value = item.name || '';
            document.getElementById('editHistNotes').value = item.notes || '';
            document.getElementById('editHistoryModal').classList.remove('hidden');
        }
        function closeEditHistoryModal() { document.getElementById('editHistoryModal').classList.add('hidden'); }
        function saveHistoryEdit() {
            const id = document.getElementById('editHistId').value;
            const phone = document.getElementById('editHistPhone').value.trim().replace(/\s+/g, '');
            if (!phone) return;
            const index = history.findIndex(h => h.id === id);
            if (index > -1) {
                history[index].phone = phone; 
                history[index].name = document.getElementById('editHistName').value.trim(); 
                history[index].notes = document.getElementById('editHistNotes').value.trim();
                localStorage.setItem('0xh_history', JSON.stringify(history));
                renderHistoryDetailed();
            }
            closeEditHistoryModal();
        }

        function confirmDelete(id) { itemToDelete = id; showDeleteModal(); }
        function confirmDeleteAll() { if (history.length === 0) return; itemToDelete = 'ALL'; showDeleteModal(); }
        function executeMultiDelete() { if (selectedIds.size === 0) return; itemToDelete = 'MULTI'; showDeleteModal(); }
        function showDeleteModal() { document.getElementById('deleteModal').classList.remove('hidden'); }
        function closeDeleteModal() { document.getElementById('deleteModal').classList.add('hidden'); itemToDelete = null; }
        
        document.getElementById('confirmDeleteBtn').onclick = function() {
            if (itemToDelete === 'ALL') history = [];
            else if (itemToDelete === 'MULTI') { history = history.filter(h => !selectedIds.has(h.id)); toggleSelectionUI(); }
            else history = history.filter(h => h.id !== itemToDelete);
            localStorage.setItem('0xh_history', JSON.stringify(history));
            renderHistoryDetailed();
            closeDeleteModal();
        };

        function renderHistoryDetailed() {
            const list = document.getElementById('detailedHistoryList');
            const filterValue = document.getElementById('historyFilter').value;
            list.innerHTML = '';
            
            let filteredHistory = history;
            const now = new Date();
            if(filterValue === 'TODAY') filteredHistory = history.filter(h => new Date(h.date).toDateString() === now.toDateString());
            else if (filterValue === 'YESTERDAY') {
                const yesterday = new Date(now); yesterday.setDate(yesterday.getDate() - 1);
                filteredHistory = history.filter(h => new Date(h.date).toDateString() === yesterday.toDateString());
            }

            if (filteredHistory.length === 0) {
                list.innerHTML = `<div class="text-center opacity-50 py-10 border-2 border-dashed border-white/10 rounded-xl">${currentLang === 'ar' ? 'لا يوجد سجل' : 'No records'}</div>`;
                return;
            }

            filteredHistory.forEach(item => {
                const card = document.createElement('div');
                card.className = 'glass-panel p-4 rounded-2xl relative bg-white/5 border border-white/10';
                
                const itemDate = new Date(item.date);
                let dateStr = itemDate.toLocaleDateString();
                const timeStr = itemDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                if (itemDate.toDateString() === now.toDateString()) dateStr = translations[currentLang].lblToday;

                let checkboxHTML = selectionMode ? `<input type="checkbox" class="custom-checkbox absolute top-4 ${currentLang === 'ar' ? 'left-4' : 'right-4'} z-10" onchange="toggleSelection('${item.id}', this.checked)" ${selectedIds.has(item.id) ? 'checked' : ''}>` : '';
                let locationTag = item.locationSent ? `<div class="mt-2 text-xs bg-blue-500/20 text-blue-300 px-2 py-1 rounded-md border border-blue-500/30 font-bold inline-block"><i class="fas fa-map-marker-alt"></i> ${translations[currentLang].lblSentLocation} ${item.locationSent}</div>` : '';
                let notesSection = item.notes ? `<div class="mt-2 pt-2 border-t border-white/10"><p class="text-xs text-[#25D366] font-bold"><i class="fas fa-sticky-note"></i> ملاحظات:</p><p class="text-sm opacity-90">${item.notes}</p></div>` : '';

                card.innerHTML = `
                    ${checkboxHTML}
                    <div class="flex justify-between items-start mb-2">
                        <div class="text-xs opacity-50 font-bold">${translations[currentLang].lblAdded} ${dateStr}، ${timeStr}</div>
                        <div class="flex gap-2 ${selectionMode ? 'hidden' : ''}">
                            <button onclick="openEditHistoryModal('${item.id}')" class="bg-blue-500/20 hover:bg-blue-500 text-blue-300 hover:text-white w-7 h-7 rounded transition"><i class="fas fa-pen text-xs"></i></button>
                            <button onclick="confirmDelete('${item.id}')" class="bg-red-500/20 hover:bg-red-500 text-red-300 hover:text-white w-7 h-7 rounded transition"><i class="fas fa-trash text-xs"></i></button>
                        </div>
                    </div>
                    <div class="font-black text-2xl mb-1" dir="ltr">+${item.phone}</div>
                    ${item.name ? `<div class="font-bold text-md text-[#25D366]">${item.name}</div>` : ''}
                    ${locationTag}
                    ${notesSection}
                    <div class="mt-3"><a href="https://wa.me/${item.phone}" class="block bg-white/10 hover:bg-[#25D366] hover:text-white text-center py-2 rounded-lg font-bold text-sm transition"><i class="fab fa-whatsapp"></i> مراسلة سريعة</a></div>
                `;
                list.appendChild(card);
            });
        }

        function toggleSelectionUI() {
            selectionMode = !selectionMode;
            selectedIds.clear();
            document.getElementById('multiDeleteBar').classList.toggle('hidden', !selectionMode);
            renderHistoryDetailed();
            document.getElementById('selectedCountText').innerText = `${selectedIds.size} محدد`;
        }
        function toggleSelection(id, isChecked) {
            isChecked ? selectedIds.add(id) : selectedIds.delete(id);
            document.getElementById('selectedCountText').innerText = `${selectedIds.size} محدد`;
        }

        function openLocManageModal(id = null) {
            const title = document.getElementById('locModalTitle');
            if (id) {
                const loc = savedLocations.find(l => l.id === id);
                document.getElementById('locModalId').value = loc.id;
                document.getElementById('modalLocName').value = loc.name;
                document.getElementById('modalLocLink').value = loc.link;
                document.getElementById('modalLocMessage').value = loc.message || '';
                title.innerText = currentLang === 'ar' ? 'تعديل الموقع' : 'Edit Location';
            } else {
                document.getElementById('locModalId').value = '';
                document.getElementById('modalLocName').value = '';
                document.getElementById('modalLocLink').value = '';
                document.getElementById('modalLocMessage').value = '';
                title.innerText = translations[currentLang].addLocationBtn;
            }
            document.getElementById('locManageModal').classList.remove('hidden');
        }
        function closeLocManageModal() { document.getElementById('locManageModal').classList.add('hidden'); }
        function saveLocationModal() {
            const id = document.getElementById('locModalId').value;
            const name = document.getElementById('modalLocName').value.trim();
            const link = document.getElementById('modalLocLink').value.trim();
            if(!name || !link) return;
            if (id) {
                const index = savedLocations.findIndex(l => l.id === id);
                if (index > -1) savedLocations[index] = { id, name, link, message: document.getElementById('modalLocMessage').value.trim() };
            } else {
                savedLocations.push({ id: Date.now().toString(), name, link, message: document.getElementById('modalLocMessage').value.trim() });
            }
            localStorage.setItem('0xh_locations', JSON.stringify(savedLocations));
            renderLocations();
            renderLocationsManager();
            closeLocManageModal();
        }
        function deleteLocation(id) {
            savedLocations = savedLocations.filter(loc => loc.id !== id);
            localStorage.setItem('0xh_locations', JSON.stringify(savedLocations));
            renderLocations();
            renderLocationsManager();
        }
        function renderLocations() {
            const select = document.getElementById('selectedLocation');
            select.innerHTML = `<option value="" class="text-gray-800">${translations[currentLang].noLocationSelected}</option><option value="CURRENT_GPS" class="text-blue-600 font-black">${translations[currentLang].currentGpsOption}</option>`;
            savedLocations.forEach(loc => {
                const opt = document.createElement('option');
                opt.value = loc.id; opt.className = "text-gray-900 font-bold"; opt.textContent = `📍 ${loc.name}`;
                select.appendChild(opt);
            });
        }
        function renderLocationsManager() {
            const listContainer = document.getElementById('locationsListContainer');
            listContainer.innerHTML = '';
            if(savedLocations.length === 0) { listContainer.innerHTML = `<div class="text-center text-sm opacity-50 py-2">لا توجد مواقع</div>`; return; }
            savedLocations.forEach(loc => {
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-white/5 p-3 rounded-xl border border-white/10";
                div.innerHTML = `
                    <div class="overflow-hidden flex-1 pl-2 rtl:pr-2"><h4 class="font-bold text-sm text-[#25D366] truncate">${loc.name}</h4><p class="text-xs opacity-70 truncate" dir="ltr">${loc.link}</p></div>
                    <div class="flex gap-2 shrink-0">
                        <button onclick="openLocManageModal('${loc.id}')" class="bg-blue-500/20 text-blue-300 w-8 h-8 rounded-lg"><i class="fas fa-pen text-xs"></i></button>
                        <button onclick="deleteLocation('${loc.id}')" class="bg-red-500/20 text-red-300 w-8 h-8 rounded-lg"><i class="fas fa-trash text-xs"></i></button>
                    </div>`;
                listContainer.appendChild(div);
            });
        }

        window.onload = init;
    </script>
</body>
</html>
